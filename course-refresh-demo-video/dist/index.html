Rewrite",hue:20,lines:[{text:"Lesson Four is rewritten to teach virtual environments. The matching quiz question is regenerated too, but held for her approval, because assessments are always human-only."},{text:"The change is committed as a new version, with a diff, and a receipt."}]},{id:"learners",label:"Learners",hue:-10,lines:[{text:"Students who opted in receive a short note explaining what changed, and why it matters."},{text:"If a few get stuck on the same step, they get a two-minute micro-lesson, before they ever write to the professor."}]},{id:"trust",label:"Control",hue:80,lines:[{text:"Professor Rivera stays in control. She chooses how much authority the system has, and a kill switch freezes everything."},{text:"At publish time, it states what would prove the change wrong. If results get worse, it reverts itself, openly, as a new version."}]},{id:"digest",label:"The morning",hue:120,lines:[{text:"The next morning, she gets one digest: what changed, what was refused, and what needs her eyes."},{text:"A few minutes over coffee, instead of a weekend of rewrites."}]},{id:"close",label:"Close",hue:0,lines:[{text:"And it's verifiable. One command runs two hundred ninety-five checks, with no credentials."},{text:"Courserefresh. The course that stays true."},{text:"So professors can get back to teaching."}]}],Of=750,Uf=420,L0=520,a2=d=>d.trim().split(/\s+/).length,si=(d,v)=>{const z=2.7*(v/.95);return a2(d.say??d.text)/z*1e3},fi=(d,v)=>Of+d.lines.reduce((z,o)=>z+si(o,v)+Uf,0)+L0,Kr=d=>{const v=Math.max(0,Math.round(d/1e3));return`${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}`};function Q({show:d=!0,delay:v=0,y:z=28,x:o=0,blur:_=12,scale:Z=1,duration:W=900,className:re="",style:D,children:A}){const[R,w]=L.useState(!1);L.useEffect(()=>{const he=requestAnimationFrame(()=>w(!0));return()=>cancelAnimationFrame(he)},[]);const q=d&&R;return c.jsx("div",{className:re,style:{opacity:q?1:0,transform:q?"none":`translate(${o}px, ${z}px) scale(${Z})`,filter:q?"blur(0px)
