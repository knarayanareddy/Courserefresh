   ledger rows by run_id; the budget check reads the ledger, never a cached
   counter. A counter can drift from reality; a ledger *is* the reality.

## 3. Cadence arithmetic, revisited with prices

Lecture 06 promised the full cost model. Here it is for the running example
(sim-mode units — labelled):

\`\`\`
scan:      6 sources × 1 unit × 24 scans/day          = 144 units/day
learn:     telemetry reads only                        ≈ 0
digest:    1/day, no external calls                    = 0
tokens:    ≈ 2 judge calls per scan-with-event         ≈ 100–400k/day at full event load
money:     (units × captured price) + (tokens × captured price) → unmeasured until prices captured
\`\`\`

The lesson of the arithmetic: **the cadence *is* the budget.** Doubling scan
frequency doubles the dominant line. When someone proposes "scan every 15
minutes," the correct response is not an opinion about freshness — it is this
table plus the freshness actually required by the subject's real change cadence
(n8n and Apify ship weekly-ish; hourly scanning already outruns the subject).
Budget pressure resolves by *reasoning about the subject*, not by enthusiasm
about vigilance.

Cap placement matters as much as cap size: the policy checks the ledger *before*
expensive action (R5's \`budget_exceeded → ESCALATE\`) — the cap gates the
*decision to spend*, not merely the report of having spent. And escalation is
**not a shutdown**: the run refuses the next spend and hands the human the
numbers ("18.4/25 units, 2 sources skipped pending approval" — Lecture 09's
posture). A budget that silently swallows work is a drift amplifier: you believe
you're scanning all sources; you're scanning the affordable ones.

## 4. When a cap fires in production

The honest escalation sequence, receipted at every step:

\`\`\`
ledger check → 18.4/25 → R5 clear → proceed
ledger check → 25.2/25 → R5 FIRES → ESCALATE [over_budget]
   · receipt: inputs preserved (which sources were pending)
   · digest line: "budget exceeded; n sources skipped pending approval"
   · human decision: raise the cap (a versioned threshold change) or accept
     reduced coverage (the next digest's scope line shows what the reduction costs)
\`\`\`

Compare the two cultures this exposes: the *cap-as-safety* culture escalates with
numbers and keeps its coverage visible; the *cap-as-setting* culture treats the
403 as an error to retry around (Lecture 09's self-inflicted incident, now with a
budget). The difference is whether the budget line is * governed * like a policy
rule (versioned, receipted, escalated) or like a YAML number somebody set once.

## 5. Common mistakes

1. **The invented euro.** Publishing a money number no captured price backs.
   \`unmeasured\` with a named reason is an answer; a guess is a liability.
2. **Nightly reconciliation.** Totalling at 07:30 from logs "when we build the
   digest" — the spend-to-book window is where overruns hide. Append at spend
   time.
3. **Budget as report, not rule.** The budget line printed in the digest but
   checked by nobody: a scoreboard, not a brake. R5 (or your equivalent) must
   gate the spend decision itself.
4. **Scanning the affordable, reporting the intended.** After partial budget
   exhaustion, the digest must name what was skipped — otherwise the coverage
   quietly shrinks while the story stays "we watch everything."

## Recap and practice

You can book the three currencies with declared approximations, do cadence
arithmetic with a subject-driven budget, and wire a cap that escalates with
evidence.

**Practice:** (a) Run your capstone's cadence arithmetic honestly: sources ×
units × scans, token estimate per event, and the *money* line — captured or
unmeasured, never guessed. State the units-source approximation you're declaring.
(b) Your mentor offers unlimited Apify credits for the demo. What changes in your
config, and what must *not* change? *(The cap raises; the ledger, the
approximation labels, and R5's escalation behaviour must not — the discipline is
the artifact, the cap is a number.)* (c) Write the digest line the morning after
your cap fires at 03:00 — refusals-first thinking applies: where does the
over-budget line sit, and what two numbers must it carry?`,objectives:["Account for a run in the three currencies — tokens, actor units, and money (or an explicit unmeasured)","Configure a budget cap that escalates to a human instead of silently stopping the world"],prerequisites:["lesson-22-the-digest"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-23-costs-and-budgets-q1",version:1,question:"The three currencies a run is booked in are:",options:["API calls, webhooks, executions","dollars, euros, credits","tokens, actor units, money — with money `unmeasured` until prices are captured into a config, never guessed","CPU, memory, network"],correctIndex:2,explanation:"Booking all three with declared approximations; unmeasured is a respectable value for the money column until a captured price table upgrades it. (obj-23-a)",objectiveRef:"obj-23-a"},{id:"lesson-23-costs-and-budgets-q2",version:1,question:"When is a ledger row written?",options:["Once per run, as a total","At nightly reconciliation, building the digest","At SPEND time, append-only — the spend-to-book window is where overruns hide, and the budget rule reads the ledger, never a cached counter","Whenever the policy asks"],correctIndex:2,explanation:"Append at spend time; a counter can drift from reality, the ledger IS the reality. (obj-23-a)",objectiveRef:"obj-23-a"},{id:"lesson-23-costs-and-budgets-q3",version:1,question:"Why is '1 actor run = 1 unit' printed on receipts?",options:["To simplify the digest","To Apify's legal requirement","Because it is a DECLARED approximation (units_source) — real per-actor pricing varies; when the approximation misleads, you upgrade the unit definition with a visible change","Because it is exact"],correctIndex:2,explanation:"Approximations are declared at the unit, not discovered at the total — the receipt tells you which accounting world you are reading. (obj-23-a)",objectiveRef:"obj-23-b"},{id:"lesson-23-costs-and-budgets-q4",version:1,question:"A budget cap fires mid-run at 03:00. What lands in the morning digest?",options:["A request to raise the cap automatically","Nothing — the run stopped; silence is correct","A stack trace","An over_budget refusal line WITH the numbers and the coverage cost ('2 sources skipped pending approval') — escalation, not shutdown; coverage stays visible so the world doesn't quietly shrink"],correctIndex:3,explanation:"The cap gates the DECISION to spend and escalates with evidence: a budget that silently swallows work is a drift amplifier. (obj-23-b)",objectiveRef:"obj-23-b"}],versions:[]},{id:124,slug:"lesson-24-capstone",title:"Lesson 24 — Capstone: run the loop on your own subject",version:1,body:`# Capstone: run the loop on your own subject

**Learning objective.** Choose a moving subject against the two-voices rule, assemble the full loop, and name the artifact each phase leaves — plus the honest-degrade plan for when the canvas, the actor, or the judge is down.

## 1. The whole course, one move

Twenty-three lectures built the disciplines one at a time. The capstone assembles
them into a running system on a subject *you* choose, and the grading contract
(\`FINAL-PROJECT.md\`) grades the *honesty of the artifacts*, not the enthusiasm of
the demo. This lecture is the assembly walkthrough — the order of operations that
survives contact with a weekend of building.

## 2. Choose the subject (the choice is graded)

The subject decides which disciplines get exercised. Apply three filters, in
order:

1. **Does it move?** A subject whose sources never change during your project
   window gives your loop nothing to notice — a statue for a watchdog. Good:
   fast-shipping OSS tools, protocol specs, regulatory trackers.
2. **Two voices, structurally?** You need an authoritative first party *and* a
   second voice outside the first's org chart (Lecture 13). n8n has its releases
   + the npm package page; a language ecosystem has its spec + implementer
   release logs. If every source you can name shares one publisher, the subject
   fails the second filter — and so does any plan whose "independent" sources are
   mirrors.
3. **Public and fetchable?** Login-walls, hostile anti-bot patterns, or paywalled
   archives drain your actor budget on plumbing instead of evidence. Pin an
   actor, test one source end to end *before* committing the subject.

The pre-registration habit from the sciences (and the running repo): **write the
source plan before building, and publish it.** Your capstone's \`SOURCE-PLAN.md\`
names each source, publisher, independence group, role, cadence, and the pair of
URLs that *look* independent but aren't — the last item because your mirror trap
(Lecture 21's practice) comes from it.

## 3. Assemble in this order (it matters)

The order below is earned failure-order: each step's artifacts make the next
step debuggable.

\`\`\`
Week 1 — NOTICE + VERIFY (Modules II–III applied):
  · source plan → config (publishers, groups, roles, allowlist hosts)
  · pinned actor per source · fetch→hash→cache (L12) · dedupe seen.json (L06)
  · required-fields check → parse_failed receipts (L08/L10)
  · deliverable: a scan that runs hourly and leaves no_delta rows for a quiet
    world — the loop's heartbeat visible in run_log.jsonl

Week 2 — DECIDE:
  · seven closed questions for YOUR subject (L14) — contamination-audited
  · policy rules, ordered, closed-taxonomy reasons (L07/L15) — both runtimes
  · gold rows: your eight traps, labelled before any run (L21)
  · parity test green at action match 1.000 before the first real decision

Week 3 — ACT + LEARN:
  · versioned artifact writes with diffs (L16) · notification path with the
    consent wall (L19) · gates armed inside publish receipts (L18)

Week 4 — REPORT + EVAL + DEGRADE:
  · digest, five sections, refusals first, from receipts only (L22)
  · three-column eval on your frozen gold set (L21) · budget caps with
    escalation (L23)
  · chaos drills: break the actor, the judge, the write — read the digest the
    next morning; every failure must be a line, not a silence (L08)
\`\`\`

The one-line completion criterion (it is the grading rubric in disguise): **every
phase leaves a named artifact, every artifact is checkable by hash, every refusal
is receipted, and every number is either measured-with-n or unmeasured.**

## 4. The artifact checklist (cupboard list)

Ship exactly these, and the rubric grades itself:

| Artifact | Proves | Lecture |
|----------|--------|---------|
| \`SOURCE-PLAN.md\` + configs | subject choice against two-voices | 13, 24 |
| pinned actor runs + snapshot set + \`seen.json\` | notice with idempotence | 06, 11, 12 |
| \`questions.json\` + contamination audit | judge blind spots | 14 |
| \`policy.*\` both runtimes + parity report | canvas decides, provably | 15 |
| \`gold.jsonl\` (versioned, trapped, ≥40) + eval report | decisions measured | 21 |
| receipts chain + \`verify_chain()==true\` | memory integrity | 16 |
| lesson/artifact versions + diffs + changelog | action versioned | 16, 18 |
| consent records + consent_missing receipts | the wall held | 19 |
| gate receipts (or honest unmeasured) | promises honoured | 18 |
| digest(s) + watchdog route | silence defeated | 22, 08 |
| ledgers + budget escalations | three currencies booked | 23 |
| degradation labels (sim/degraded/offline-twin) wherever present | honesty | 08 |

A missing row is a missing discipline — and the post-build review will find it,
so you find it first.

## 5. The seven questions your demo will get

Prepare these answers as artifact pointers, not sentences (the "say this" column
is pointers — JUDGING-MAP style):

1. **"Isn't this an LLM rewriting a doc?"** → seven closed questions + parity
   report. (L14/L15)
2. **"What if the source is wrong?"** → mirror-trap gold row + R2 + gate
   receipts. (L13/L15/L18)
3. **"Who approves this?"** → authority ladder + PA3 wall + signoff receipts.
   (L02/L17)
4. **"What did it do last night?"** → the digest, refusals first. (L22)
5. **"When does it stop?"** → the stop-condition list + the two zero-metrics.
   (L04/L21)
6. **"How do you know it works?"** → three columns, same models, gold frozen.
   (L21)
7. **"What happens when it's wrong?"** → the revert receipt — or the honest
   \`unmeasured\` + the rule that will fire. (L18)

If an answer needs an adjective, it needs an artifact instead. "Seamless" dies in
demo; a receipt chain survives the follow-ups.

## 6. The honest-degrade plan (the graded safety net)

For each dependency, write the labelled fallback *before* you need it (the
drills in Week 4 exercise each):

| Dependency down | Your labelled fallback | The label the system prints |
|-----------------|------------------------|------------------------------|
| n8n canvas | offline twin decides, same rules (parity earns this) | \`OFFLINE TWIN\` |
| Apify / actor | fixture snapshots with hashes; live flags off | \`DEGRADED\` |
| Judge endpoint | fail-closed: escalate \`unknown_state\`; nothing publishes on judge absence — **never a fallback prompt** | \`DEGRADED\` |
| Git/repo write | error receipt + preserved diff; retry next cycle | \`DEGRADED\` (write_failed) |
| Budget | R5 escalation with numbers, coverage named | digest line |

The judge-down row is the one teams get wrong: the temptation is a "backup
smaller model" — but a fallback judge with different calibration turns your
thresholds into folklore (L14's instrument argument). Fail closed instead; the
world survives an hour of no publishes, it does not survive silently miscalibrated
ones.

**And the last discipline: run it while nobody watches.** The capstone's final
week is three overnights with the loop live and no human touch. Friday-you sets
up; Tuesday-you reads digests and argues with receipts. That gap — the loop
running unsupervised and the account surviving scrutiny — is the entire distance
between an agent demo and agent operations. It is the course's whole point.

## Recap and practice

You can choose a subject against the filters, order the build by failure-order,
ship the cupboard, and answer the seven questions with artifacts.

**Practice (the only one — do it): begin.** Write \`SOURCE-PLAN.md\` tonight: the
subject, the sources with publishers/groups/roles, the mirror pair, the cadence
arithmetic with its declared approximation, and your three chaos drills. Then
build Week 1 — and stop when the world's first \`no_delta\` row lands in your log.
That quiet, receipted, boring row is the sound of the loop working.`,objectives:["Choose a moving subject whose sources are public, fetchable and independent, and justify the choice against the two-voices rule","Assemble the full loop — scan, triage, act, learn, digest — for that subject and name the artifact each phase leaves","Write the honest-degrade plan: what the system prints when the canvas, the actor or the judge is down"],prerequisites:["lesson-23-costs-and-budgets"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-24-capstone-q1",version:1,question:"Your friend proposes 'the Rust language' as a capstone subject. Which filter does it most likely fail, and why?",options:["Two voices structurally — the spec, the compiler's release log, and the book are all one publisher (the Rust project); finding a genuinely independent second voice outside that org chart is the hard part","Does it move — Rust rarely changes","None — Rust is an excellent subject","Public and fetchable — Rust docs are paywalled"],correctIndex:0,explanation:"The two-voices filter is about structural independence: many excellent subjects have one authoritative ecosystem whose every artifact shares a publisher. The source plan must find the voice OUTSIDE. (obj-24-a)",objectiveRef:"obj-24-a"},{id:"lesson-24-capstone-q2",version:1,question:"The pre-registration habit applied to the capstone means:",options:["Pre-register the model you will use","Write and publish the SOURCE-PLAN before building: sources, publishers, groups, roles, cadence — including the URL pair that LOOKS independent but isn't","Publish the code before writing it","Register the project with the course admin"],correctIndex:1,explanation:"The plan-before-build discipline, inherited from the sciences and the running repo, is what makes your mirror trap honest — it comes from your own published plan. (obj-24-a)",objectiveRef:"obj-24-b"},{id:"lesson-24-capstone-q3",version:1,question:"Why assemble the loop in the order notice→verify, then decide, then act→learn, then report→eval→degrade?",options:["It is the cheapest sequence","Verification is the hardest part","It matches the lecture numbering","Failure-order: each step's artifacts make the next debuggable — a heartbeat of visible no_delta rows before any decision, parity-green rules before any real publish, receipts before digests"],correctIndex:3,explanation:"The build order is earned failure-order — you want the loop's heartbeat visible and the rules proven before the first versioned write. (obj-24-b)",objectiveRef:"obj-24-b"},{id:"lesson-24-capstone-q4",version:1,question:"The judge endpoint goes down mid-capstone. What is the correct degraded behaviour?",options:["Pause the whole system until the judge returns","Let the policy decide without judge answers","Fail CLOSED — escalate unknown_state, publish nothing: a fallback judge with different calibration turns your thresholds into folklore; the world survives an hour of no publishes","Switch to a smaller backup model so the loop keeps working"],correctIndex:2,explanation:"The judge is a measurement instrument; swapping instruments mid-run invalidates the measurements. Fail closed and label it degraded. (obj-24-c)",objectiveRef:"obj-24-c"}],versions:[]}]},uS=[cS,oS,rS,lS];function dS(s){return s.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>").replace(/^\| (.+) \|$/gm,a=>{const o=a.split("|").filter(d=>d.trim());return o.every(d=>/^[-:]+$/.test(d.trim()))?"":`<tr>${o.map(d=>`<td>${d.trim()}</td>`).join("")}</tr>`}).replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g,a=>`<table>${a}</table>`).replace(/
