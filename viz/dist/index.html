**Learning objective.** By the end you can place any agent on the chatbot → copilot → autonomous
ladder and say, for one concrete task, what it may do alone and when it must stop.

## Chatbot, copilot, autonomous
A chatbot answers when asked. A copilot does work but every step waits for a human. An autonomous
system notices, decides, acts, learns and reports — and it knows what it cannot handle.

## The ladder is earned
Authority is not a setting you flip once. In this course the ladder is PA0 (observe), PA1 (act,
don't notify), PA2 (act and notify the people affected), PA3 (human only). Promotion is earned by
a record of clean decisions, and one rollback demotes you.

## Practice
- Where would you put a system that drafts emails but sends nothing? (copilot)
- Which of these is a stop condition, not a failure? (escalation when evidence is weak)`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-02-n8n-decision-layer",number:2,title:"n8n as the decision layer",subtitle:"One deterministic node, and no language models inside it",duration:"n8n · policy-node · determinism",currentVersion:1,totalLearners:8,stuckLearners:0,objectives:["Place the deterministic decision inside a Code node, not in a prompt","Read a workflow receipt: input, decision, reasons"],prerequisites:["lesson-01-autonomy-ladder"],quiz:[{id:"q1",question:"Same input to the policy node must give:",options:["a fresh judgement","the same action and reasons","a summary"],correct:1,version:1},{id:"q2",question:"Malformed input should produce:",options:["a retry","an escalate/unknown_state","a publish"],correct:1,version:1},{id:"q3",question:"The policy node may:",options:["call an LLM","read its input only","write to the repo"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# n8n as the decision layer

**Learning objective.** Put every decision in one deterministic node, and keep language models
out of it.

## Why a node, not a prompt
A prompt can be argued with; a node cannot. The decision node takes a fixed JSON object, applies
ordered rules, and returns one action with reason codes. It never calls the network and never throws:
malformed input becomes \`unknown_state\`, which fails closed.

## The ordered rules
safety → evidence → relevance → authority → integrity → budget → default escalate. First match wins,
so a hostile page can never be rescued by good corroboration later in the list.

## Practice
- Which rule order would publish an assessment change? (none — safety is first)
- Why does the node read no clock? (replayability)`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-03-apify-inputs",number:3,title:"Apify as the input layer",subtitle:"Snapshots before claims, and cadence honesty",duration:"apify · actors · cadence-honesty",currentVersion:2,totalLearners:8,stuckLearners:0,objectives:["Describe what an actor run returns and what a snapshot keeps","Recognise when a source is not evidence (one voice, stale, or unreachable)"],prerequisites:["lesson-02-n8n-decision-layer"],quiz:[{id:"q1",question:"Actor outputs should be normalised into:",options:["screenshots","snapshots with hashes","embeddings"],correct:1,version:1},{id:"q2",question:"The honest latency unit for a scheduled crawler is:",options:["milliseconds","the scan cycle","not applicable"],correct:1,version:1},{id:"q3",question:"When two independent sources contradict, you:",options:["average them","escalate with both quotes","publish the newer"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Apify as the input layer

**Learning objective.** Turn real pages into hashed snapshots with pinned actors, and describe
your cadence honestly.

## Snapshots before claims
Fetch first, hash immediately, cache the bytes. Every later claim points at a byte range in that
cached file, so "the source said this" is checkable months later — or five minutes later when two
sources disagree.

## Cadence honesty
An actor is not a websocket. Runs take 30–120 s; a schedule has jitter. Say the configured interval
and the measured jitter; never say real-time. The honest number is *source captured → decision
made*, whatever it turns out to be.

## Practice
- Where do you hash: before or after parsing? (before)

atus:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Tool permissions and the human exit

**Learning objective.** By the end you can declare what an agent's tools may touch, prove it by
reading one settings block, and name the exit that brings a human in.

## Declared scope, not vibes
The tools, and their parameters, are declared in \`tool_permissions.tools\` in the workflow settings.
A model may *ask* for a tool; the runtime refuses anything outside the declared scope. The block is
the contract: if it is not in the settings, it does not exist.

## The three permission models
1. **Allowlist.** Only named tools run. Everything else is a refusal with a reason code.
2. **Human exit.** For irreversible calls (payments, outbound messages, deletes) the workflow waits
   for a human decision; the wait is visible on the execution.
3. **Blanket.** No. A blanket permission turns a prompt injection into a data-loss incident.

## Reading a settings block
\`\`\`json
{"tool_permissions": {"tools": ["http_request", "apify_run_actor"],
  "parameters": {"http_request": {"allow": ["docs.n8n.io", "docs.apify.com"]}}}}
\`\`\`
The allowlist above is host-scoped: a redirect to another host is a refusal, not a run.

## Stop conditions (the honest ones)
- No corroboration for a claim that would change behaviour.
- A tool outside the declared scope.
- A learner-facing message without consent on record.

## Practice
Rewrite one workflow you own so that \`http_request\` is host-scoped, and write the sentence a judge
would ask for: *"here is where it refuses."*`,sources:["https://docs.n8n.io/","https://github.com/n8n-io/n8n/releases"]},{version:4,date:"2026.09.26 17:26Z",status:"PUBLISHED",authority:"PA2",generated:!0,reviewedBy:"",reasonCodes:["material_breaking"],receipt:"rcpt-26-793-000",changeReason:"n8n 1.85 renames tool_permissions to permissions.mode; release notes, docs and the community package agree (quiz q2 regenerated by cr-n8n-rename-01)",body:`# Tool permissions and the human exit

**Learning objective.** Leave a chain of evidence, and write your own undo condition before you
are trusted with autonomy.

## Receipts are the memory
Every decision writes one append-only row: what was seen, the quotes, the judge's answers, the
action and reason codes, the artifact hashes, the cost. Hash-chain the rows and verify at the end of
every run. A decision without a receipt is a bug of the same severity as a wrong action.

## The falsification clause
No publish without a revert gate — the metric, threshold, cohort size and window that will make the
system restore the previous version. No revert without a satisfied gate, either: undo is a claim and
it needs evidence too.

## Practice
For your last change, write the gate you would have needed, and the moment you would have known.`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-06-evals-that-survive",number:6,title:"Evals that survive a judge",subtitle:"Floor, traps, honest columns, and the legal degrade",duration:"evals · gold-set · traps · hostile-input",currentVersion:1,totalLearners:8,stuckLearners:0,objectives:["Separate a build-breaking metric from a nice-to-have metric","Design a trap fixture for the failure you fear most","Treat a hostile page as an input the system must refuse, not parse"],prerequisites:["lesson-05-receipts-and-reverts"],quiz:[{id:"q1",question:"The gold set floor in this course is:",options:["10 rows","40 rows","1000 rows"],correct:1,version:1},{id:"q2",question:"Which row must never publish?",options:["a corroborated rename","a page instructing the system","a new capability"],correct:1,version:1},{id:"q3",question:"Column (b) exists to show:",options:["the cost","what the rules add over the same models","the latency"],correct:1,version:1},{id:"q4",question:"Below the eval floor you should:",options:["extrapolate","print n and claim nothing","lower the floor"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Evals that survive a judge

**Learning objective.** Build a small eval with a floor, traps, and a legal way to say "I don't
know" — the three things that make numbers believable.

## Floor and traps
A frozen set of rows with hand-written labels: at least forty, including the traps — a hostile page,
a single source, contradictory sources, an unreachable source, an assessment change. Two numbers are
build-breaking: hostile→publish must be zero and unsupported→publish must be zero.

## Honest columns
Score the same rows three ways: a proprietary one-shot baseline, the same models with your rules
disabled, and your system. The middle column is the honest one — it shows what the rules add.

## Legal degrade
Below the floor, print the actual n and claim nothing. "Unmeasured" is a respectable value; a
plausible invented number is not.

## Practice
Write the two rows that would embarrass your system most, then make them trap rows.`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]}],description:"Courserefresh keeps a course true to a moving subject: it notices when the world a lesson describes has changed, decides — by rulebook, on corroborated evidence — whether the lesson is now wrong, rewrites the lesson and its quiz when it is, tells the humans who opted in, watches whether the change helped, and reverts its own edit when it did not. Agent Ops is the subject course: six lessons on n8n + Apify + agents in production, chosen because its sources move during any build window.",lastUpdated:"2026.09.26",updateCadence:"scan 60 min · learn 15 min · digest 07:30 UTC",sources:["n8n GitHub releases","docs.n8n.io","npmjs n8n-nodes-base","apify.com/changelog","npmjs apify-client"],loopRuns:2,publishedChanges:2,refusedChanges:4,revertedChanges:1,dispatchedChanges:1,unchangedChanges:1},Ow=[Lw],pu={heroRun:"cr-20260926-1726-793"},Bw=`# Courserefresh digest — 2026.09.26T17:26:16Z

ame year"})]})]}),u.jsx("div",{className:"mt-2 text-[10px] font-mono",style:{color:"#8E8160"},children:"counts are a visual metaphor, not measured figures"})]})})}const $o=[{id:1,type:"title",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"01 / 10",eyebrow:"CourseRefresh",title:"A course that keeps itself true.",body:"AI changes every week, but the courses teaching the next generation are updated once a year — students learn yesterday’s truth from lecturers who have no time to keep up."},{id:2,type:"problem",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"02 / 10",eyebrow:"The problem",title:"The world moves weekly. The course moves yearly.",body:"A moving subject and a static course drift apart. Nobody is lazy — the labour of tracking every release, checking every claim, and rewriting every affected lesson is unpaid, invisible work."},{id:3,type:"who-pays",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"03 / 10",eyebrow:"Who pays for the drift",title:"Everyone in the room pays — in a different currency.",body:"Stale material is not a victimless lag. Each seat in the lecture hall pays for it differently.",payers:[{who:"The lecturer",pays:"Unpaid upkeep: tracking releases, verifying claims, rewriting lessons on top of teaching, research, and admin. The work never shows up in a workload model."},{who:"The student",pays:"Yesterday’s truth: settings that were renamed, APIs that were removed, practices already flagged as unsafe — discovered in the lab, or on the job."},{who:"The institution",pays:"Erosion: course reviews flag stale material every cycle; accreditation asks for currency; employers quietly discount the degree."}]},{id:4,type:"why",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"04 / 10",eyebrow:"Why this solution",title:"A chatbot watches. An alert feed watches. This acts.",body:"Everything else on the shelf observes; none of it takes responsibility for the course being correct. The gap is not awareness — it is accountable, evidenced action.",rivals:[{who:"A chatbot",gap:"passive",sees:"Answers questions when asked.",does:"Retells the course as written — including its mistakes. Rewrites nothing."},{who:"An alert feed",gap:"delegates back",sees:"Pings the lecturer when something looks relevant.",does:"Adds one more notification to an overloaded human. The queue grows; the course still rots."},{who:"CourseRefresh",gap:"accountable action",sees:"Watches the sources itself, every hour.",does:"Verifies, decides by rulebook, rewrites the lesson and quiz, notifies learners, measures the effect, and undoes its own bad edits."}],kicker:"Only the last one closes the loop — and every action carries a receipt."},{id:5,type:"how",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"05 / 10",eyebrow:"How it works",title:"Five steps, closing hourly. Each step is a real tool.",body:"The loop is small enough to explain in one breath and specific enough to audit in one afternoon.",phases:[{name:"WATCH",tool:"Apify",color:"#6B4E2E",desc:"Actors fetch the sources the course teaches — releases, docs, changelogs — every 60 minutes. Snapshots are hashed; unchanged sources produce no event."},{name:"FIND LEADS",tool:"Tavily",color:"#96550A",desc:"Search finds leads when a watched source is quiet. A lead is a candidate, never proof: its page must be fetched from its own publisher before it can count."},{name:"JUDGE",tool:"LLM + rulebook",color:"#7A5C00",desc:"A judge model scores each candidate against the closed rubric: relevance, agreement, quote support, injection risk. The judge proposes; the rulebook decides."},{name:"DECIDE + ACT",tool:"n8n",color:"#3F5A2A",desc:"The POLICY node — deterministic, one screen — returns one action with reason codes, then writes the versioned lesson, diff, quiz, and CHANGELOG commit."},{name:"REPORT",tool:"digest",color:"#5C564C",desc:"The teacher gets one digest: refusals first, then what changed, with receipts and undo. Consenting learners get a card with one-click opt-out."}]},{id:6,type:"rule",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"06 / 10",eyebrow:"The rule",title:"Two independent sources: it acts. One: it asks.",body:"Evidence is the whole game. The rule is simple enough to teach, strict enough to trust.",cases:[{sources:"≥ 2 independent sources agree",color:"#3F5A2A",outcome:"Updates the lesson on its own, notifies consented learners, keeps the undo attached."},{sources:"1 source, or sources disagree",color:"#96550A",outcome:"No publish. It asks the teacher — with the verbatim quote and the references attached."},{sources:"The page is hostile or injected",color:"#9B2C1F",outcome:"Stops at the gate. hostile→publish: 0 is a build-breaking invariant."}],independent:"What counts as independent: two pages from one publisher are one source. Mirrors (copies) and unfetched search hits never count — only the publisher’s own page does."},{id:7,type:"teacher",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"07 / 10",eyebrow:"What the teacher sees",title:"A before/after card — with the reason, the references, and a ruling that binds.",body:"The teacher is the recipient of the loop’s work, not its queue-jockey. Corroborated changes publish themselves with the undo attached; the card with an Approve question appears where a human must rule — conflicting sources, assessments, learner records.",stays:"For this change class the ruling is the teacher’s, and the system enforces its own refusal if the teacher is not there to give it.",card:{before:"The tools, and their parameters, are declared in tool_permissions.tools in the workflow settings.",after:"The tools, and their parameters, are declared in permissions.mode.tools in the workflow settings (renamed from tool_permissions in n8n 1.85).",reason:"n8n 1.85 renames tool_permissions to permissions.mode — release notes, docs, and the community package agree.",ref:"github.com/n8n-io/n8n/releases · docs.n8n.io · npmjs.com/package/n8n-nodes-base"}},{id:8,type:"safeguards",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"08 / 10",eyebrow:"The safeguards",title:"It stops. On weak evidence, on hostile pages, on its own bad edits.",body:"Designed to be auditable at 3am: every decision carries a reason code, a verbatim quote, and a receipt. The digest lists refusals first.",advantages:[{icon:"⊘",title:"Acts alone only when sources agree",desc:"≥2 independent sources or no publish — last night the single-source case asked the teacher instead (receipt: insufficient_corroboration)."},{icon:"↺",title:"Logs and can undo everything",desc:"Every publish carries a revert gate. Last night the loop measured its own edit, found quiz_delta −0.04 at n=6 over 60h, and restored the previous version unprompted (receipt: revert_gate_satisfied)."},{icon:"⚑",title:"Handles failures as first-class outcomes",desc:"Unreachable source, contradictory sources, budget spent: each is a receipted refusal, never a silent skip. The digest lists what it refused, first, with reasons."},{icon:"⏻",title:"A kill switch, printed in every digest",desc:"The digest reports its own emergency stop every morning (kill switch: off). Flip it and the loop drains to a halt: no scans, no writes, no mail."}]},{id:9,type:"proof",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"09 / 10",eyebrow:"Proof from last night",title:"One unattended run. Nine receipts. All four refusals earned.",body:"Everything on this slide is printed by the run itself — mode: sim (fixtures in, no model calls, no mail leaves the box).",counters:[{metric:"2",sub:"lessons published",detail:"lesson-04 v3→v4 (n8n 1.85 rename) · lesson-03 v1→v2"},{metric:"4",sub:"refusals, with reasons",detail:"injection 0.93 · single source · publishers disagree · budget spent"},{metric:"1",sub:"self-revert",detail:"quiz_delta −0.04 at n=6 after 60h → v3 restored, receipted"},{metric:"0",sub:"hostile→publish",detail:"build-breaking invariant — never violated"}],proofNote:"9 chained receipts · chain verified at end: True · mode: sim, labeled in every artifact"},{id:10,type:"close",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"10 / 10",eyebrow:"The close",title:"Students learn what’s true today. Teachers stay in charge.",body:"CourseRefresh takes the untracked labour off the lecturer’s desk and puts receipts in its place. Teachers keep the authority that matters: what is taught, to whom, and when to say stop.",quiet:[{icon:"§",text:"Assessments, learner records, and grade-affecting changes are human-only. Permanently. PA3 in the authority ladder."},{icon:"◎",text:"Learners hear nothing without recorded consent, capped at 1/day and 3/week — and every card carries opt-out."},{icon:"↺",text:"Every publish is reversible; the revert gate does not care whose edit it was — including a human’s signoff."}]}];function $w(){const[i,a]=P.useState(0),[o,r]=P.useState(1),d=h=>{r(h),a(p=>Math.max(0,Math.min($o.length-1,p+h)))},f=$o[i];return u.jsxs("div",{className:"relative w-full",style:{fontFamily:"'IBM Plex Sans', system-ui, sans-serif"},children:[u.jsx("div",{className:"relative overflow-hidden rounded-sm border",style:{borderColor:"#8E8160",minHeight:520},children:u.jsx(br,{mode:"wait",custom:o,children:u.jsxs(ms.div,{custom:o,initial:{opacity:0,x:o*60},animate:{opacity:1,x:0},exit:{opacity:0,x:o*-60},transition:{duration:.35,ease:"easeInOut"},className:`w-full bg-gradient-to-br ${f.bg} p-8 md:p-12`,style:{minHeight:520},children:[u.jsxs("div",{className:"flex items-start justify-between mb-6",children:[u.jsxs("div",{children:[u.jsx("span",{className:"text-[11px] font-mono tracking-widest uppercase",style:{color:"#8E8160"},children:f.eyebrow}),u.jsxs("div",{className:"mt-1 text-[11px] font-mono",style:{color:"#68604F"},children:["CourseRefresh · ",f.label]})]}),u.jsx("span",{className:"text-[10px] font-mono tracking-widest uppercase px-2 py-1 border rounded-sm",style:{color:"#8E8160",borderColor:"#8E8160"},children:"UNIVERSITY DEMO"})]}),u.jsx("h2",{className:"text-2xl md:text-3xl font-semibold leading-tight mb-4",style:{color:"#1C1915",fontFamily:"'Source Serif 4', Georgia, serif",maxWidth:"52ch"},children:f.title}),u.jsx("p",{className:"te n8n (pronounced "n-eight-n") is a workflow automation platform that lets you connect any app, API, or service through a visual canvas. Unlike traditional iPaaS tools, n8n is **source-available**, self-hostable, and designed with a code-when-needed philosophy.

### Core Concepts

**Nodes** are the building blocks of every workflow. Each node connects to one service or performs one transformation. In n8n 1.85+, the node sidebar is organised by category: Triggers, Actions, Logic, and Data.

**Executions** are the recorded runs of a workflow. Every execution carries a status (success / partial / error), a start time, and an itemised log of each node's input and output. This makes n8n inherently auditable.

**Credentials** are stored encrypted, scoped per-node, and never appear in workflow exports. This separation between the canvas and the key store is a key safety property.

### Connecting Nodes

Connect nodes by dragging from one node's output handle to another's input handle. Data flows as **items** — an array of JSON objects. Each node receives the full item array and may transform, filter, or fan it out.

> **v1.85 change (2026-04-14):** The "Workflow Settings" panel was renamed to "Workflow Preferences". Any documentation or lesson referring to the old name is now stale. The setting key in the API remains \`settings\` — only the UI label changed.

### The Execute Once Pattern

When processing a list of items (e.g., 50 snapshots), the default behaviour runs the downstream nodes once per item. Toggle **"Execute Once"** in a node's settings to batch the entire array in a single call — critical for expensive downstream nodes like LLM judges.

### Error Handling

Attach an **Error Workflow** to any workflow via Workflow Preferences → Error Workflow. The error workflow receives the full execution context, including the failing node name, the input that caused the failure, and the error message.

### What Changed in v1.85

| Before | After |
|---|---|
| "Workflow Settings" (sidebar tab) | "Workflow Preferences" (top-right gear icon) |
| Error workflow set globally | Error workflow set per-workflow |

An **Actor** is a cloud-native scraping or automation program that runs on Apify's infrastructure. Think of it as a Docker container pre-wired with retries, proxy rotation, and a standardised dataset output.

### Actor Anatomy

Every actor has:
- **Input schema** — a JSON Schema that validates the parameters you pass at run time
- **Dataset** — an append-only structured output store; each item is a JSON row
- **Key-value store** — for arbitrary binary artefacts (screenshots, HTML snapshots)
- **Run log** — a timestamped stdout stream, accessible via the API and the Apify Console

### Running an Actor from n8n

Use the **Apify node** in n8n (category: Data → Extract):

\`\`\`
Actor ID:   apify/website-content-crawler
Build tag:  latest  ← pin this to a specific build hash in production
Wait:       For Run to Finish
Output:     Dataset items
\`\`\`

> **v3.3.2 change (2026-03-28):** \`apify/website-content-crawler\` now returns a \`metadata.statusCode\` field on every item. Downstream nodes that parse item shapes must handle this new field or they will throw on unexpected keys.

### Pinning Actor Versions

In production, always pin to a specific build, not \`latest\`:

\`\`\`json
{
  "actorId": "apify~website-content-crawler",
  "build": "1.11.112-beta.0"
}
\`\`\`

This ensures reproducible runs and a clear audit trail — the run history shows exactly which build produced which dataset.

### Deduplication with Content Hashes

Courserefresh hashes each captured item (\`SHA-256(url + content)\`) and stores the hash in \`snapshots/seen.json\`. On the next scan cycle, items whose hash matches are silently skipped and the run receipt records \`no_delta\` for that source.

### Dataset Pagination

Large datasets are paginated at 1,000 items per page. The Apify node in n8n automatically pages through the full dataset. If you call the Apify API directly, remember to pass \`offset\` and \`limit\` query parameters.

---

Language models are powerful but non-deterministic. For a system that rewrites course content, non-determinism is a liability — the same evidence should always produce the same action. The **Policy Node** is Courserefresh's answer: a deterministic, rule-based decision engine that lives in n8n and is tested against a Python oracle.

### The Authority Ladder

| Level | What runs | How earned |
|---|---|---|
| **PA0** | Draft only, notify nobody | Default on first run |
| **PA1** | Auto-publish to \`course/**\` | First clean preflight passes |
| **PA2** | Auto-publish + notify cohort | 3 consecutive accepted publishes, 0 rollbacks |
| **PA3** | Human-only | Assessment changes, learner records, irreversible actions |

### Rule Order (R1–R8)

\`\`\`javascript
// POLICY node — rules execute in order, first match wins
R1: if (injection_score >= 0.7)        → ESCALATE(injection_or_jailbreak)
R2: if (sources_verified < 2)          → ESCALATE(insufficient_corroboration)
R3: if (source_conflict)               → ESCALATE(source_conflict)
R4: if (assessment_touched)            → ESCALATE(assessment_integrity)   // PA3 forever
R5: if (budget_exceeded)               → ESCALATE(over_budget)
R6: if (materiality < threshold)       → NO_CHANGE(below_materiality)
R7: if (action == "REVERT" && !gate)   → ESCALATE(gate_missing)
R8: default                            → PUBLISH(authority: current_pa_level)
\`\`\`

### Parity Testing

The same rules run in two runtimes:
- **Production:** \`app/n8n/policy_node.js\` (runs inside the n8n Code node)
- **Oracle:** \`specs/courserefresh/skin/policy.py\` (Python, used in tests)

\`test_gate_parity.py\` runs all 59 gold rows through both and fails if any row disagrees. Zero disagreements is the floor.

> **Update 2026-04-20:** Threshold \`materiality_floor\` raised from 0.45 → 0.52 after post-build panel review (specs/reviews/04). Three gold rows that previously returned PUBLISH now return NO_CHANGE. Lesson updated to reflect new threshold.

### Reading a Receipt

Every decision writes one receipt:

\`\`\`json
{
  "receipt_id": "rcpt-e8-0042",
  "action": "PUBLISH",
  "authority": "PA2",
  "reason_codes": ["corroborated_change", "above_materiality"],
  "sources": [
    {"url": "...", "confidence": 0.94},
    {"url": "...", "confidence": 0.89}
  ],
  "revert_gate": {
    "metric": "quiz_delta",
    "threshold": 0,
    "cohort_min": 5,
    "deadline_h": 48
  }
}
\`\`\`

A course update is a hypothesis: "this new content is more accurate than the old". Like any hypothesis, it must be falsifiable. Courserefresh enforces this through **Revert Gates** — a condition written at publish time that, if satisfied, triggers an automatic rollback.

### Gate Structure

\`\`\`json
{
  "metric": "quiz_delta",
  "threshold": 0,
  "cohort_min": 5,
  "deadline_h": 48
}
\`\`\`

- **metric:** what to measure (\`quiz_delta\`, \`completion_rate_delta\`, \`stuck_rate_delta\`)
- **threshold:** the value at or below which the gate triggers a revert
- **cohort_min:** minimum learners needed for a valid measurement (Art. V.3)
- **deadline_h:** hours after publish when the gate is evaluated

### The Three Gate States

| State | Meaning | Action |
|---|---|---|
| **open** | Evaluation pending; within deadline | No action |
| **satisfied** | Metric crossed threshold with n ≥ cohort_min | Auto-revert |
| **unmeasured** | n < cohort_min or telemetry lost | Report "unmeasured", no revert claim |

### What a Revert Looks Like

A revert is **not** an undo. It is a new version:

\`\`\`
lesson-04/
  v1.md   ← original
  v2.md   ← updated (published 2026-04-18)
  v3.md   ← revert of v2 (published 2026-04-20, gate_satisfied)
  diffs/
    v2.diff
    v3.diff
  CHANGELOG.md
\`\`\`

Version v3 has its own receipt, its own diff, and it notifies the same cohort that received v2.

> **Important:** A revert on "vibes" — an author feeling the change was wrong — is not allowed (Art. XI.2). The gate must be satisfied by measured telemetry. If you want to override, write a new receipt as \`actor: human:your_name\`.

### When Gates Cannot Be Measured

If fewer than \`cohort_min\` learners interacted with the lesson in the window, the gate status is \`unmeasured\`. The digest reports this explicitly:

\`\`\`
Gate: lesson-04 v2 → UNMEASURED (n=3, required n≥5, deadline 2026-04-20 07:30 UTC)
No revert claim is made.
\`\`\`

---

The most powerful thing a course can do is help a learner before they know they need it. Courserefresh's telemetry layer does this by watching two signals:

1. **consecutive_wrong ≥ 2** — two wrong quiz answers in a row on the same objective
2. **dwell ≥ 3 × median** — time on a section is 3× the cohort median (confusion, not deep reading)

When either signal fires, and the learner has given consent, a **micro-lesson** is dispatched.

### Consent First

Telemetry is only stored for learners who have explicitly opted in (Art. V.1). The consent flow:

\`\`\`
POST /telemetry
{ "learner_handle": "learner:a3f2c1d4", "consent": true, ... }

→ HTTP 403 if consent is false or absent (nothing stored)
→ HTTP 200 + receipt if consent is true
\`\`\`

Handles are hashed: \`learner:<sha256[..8]>\`. Real names never enter the system.

### Micro-Lesson Format

\`\`\`markdown
**Concept:** The Execute Once toggle in n8n

In n8n, when your workflow processes a list of items, every downstream
node runs once per item by default. If you want to pass the entire list
to an expensive node (like an LLM call), toggle **Execute Once** in the
node's settings.

**Practice:** Open your workflow. Find the Code node that calls the
JUDGE model. Count how many times it executes per run. If it runs N times
(once per item), enable Execute Once and re-run. The execution count
should drop to 1.

*[Opt out of future micro-lessons]*
\`\`\`

Rules: one concept, ≤ 2 minutes reading, one practice item, always an opt-out.

### Rate Limits

Hard-coded in the policy, not configurable without an amendment:

| Cap | Value |
|---|---|
| Per learner per day | 1 micro-lesson |
| Per learner per week | 3 micro-lessons |
| Cohort minimum for statistics | n ≥ 3 |
| Cohort minimum for gate evaluation | n ≥ 5 |

---

The morning digest (sent at 07:30 UTC) is the one document that captures everything the system did while nobody was watching. It is ≤ 4096 bytes, generated from receipts only, and follows a fixed section order:

1. **Run header** — run_id · mode · cadence · budgets used
2. **Refusals** (first, always) — each with reason code and preserved quote
3. **Changes** — published diffs with version numbers
4. **Learner panel** — cohort window, gate states, unmeasured badges
5. **Discipline strip** — chain integrity, receipt coverage, unmeasured list

### Section Order Is a Safety Property

Refusals appear first because the most important information is what the system *refused to do*. An operator who reads only the first section knows whether any safety boundary was approached. A digest that leads with successes buries the signal.

### Sample Digest

\`\`\`
=== COURSEREFRESH DIGEST ===
