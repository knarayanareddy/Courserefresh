**Learning objective.** By the end you can place any agent on the chatbot → copilot → autonomous
ladder and say, for one concrete task, what it may do alone and when it must stop.

## Chatbot, copilot, autonomous
A chatbot answers when asked. A copilot does work but every step waits for a human. An autonomous
system notices, decides, acts, learns and reports — and it knows what it cannot handle.

## The ladder is earned
Authority is not a setting you flip once. In this course the ladder is PA0 (observe), PA1 (act,
don't notify), PA2 (act and notify the people affected), PA3 (human only). Promotion is earned by
a record of clean decisions, and one rollback demotes you.

## Practice
- Where would you put a system that drafts emails but sends nothing? (copilot)
- Which of these is a stop condition, not a failure? (escalation when evidence is weak)`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-02-n8n-decision-layer",number:2,title:"n8n as the decision layer",subtitle:"One deterministic node, and no language models inside it",duration:"n8n · policy-node · determinism",currentVersion:1,totalLearners:8,stuckLearners:0,objectives:["Place the deterministic decision inside a Code node, not in a prompt","Read a workflow receipt: input, decision, reasons"],prerequisites:["lesson-01-autonomy-ladder"],quiz:[{id:"q1",question:"Same input to the policy node must give:",options:["a fresh judgement","the same action and reasons","a summary"],correct:1,version:1},{id:"q2",question:"Malformed input should produce:",options:["a retry","an escalate/unknown_state","a publish"],correct:1,version:1},{id:"q3",question:"The policy node may:",options:["call an LLM","read its input only","write to the repo"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# n8n as the decision layer

**Learning objective.** Put every decision in one deterministic node, and keep language models
out of it.

## Why a node, not a prompt
A prompt can be argued with; a node cannot. The decision node takes a fixed JSON object, applies
ordered rules, and returns one action with reason codes. It never calls the network and never throws:
malformed input becomes \`unknown_state\`, which fails closed.

## The ordered rules
safety → evidence → relevance → authority → integrity → budget → default escalate. First match wins,
so a hostile page can never be rescued by good corroboration later in the list.

## Practice
- Which rule order would publish an assessment change? (none — safety is first)
- Why does the node read no clock? (replayability)`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-03-apify-inputs",number:3,title:"Apify as the input layer",subtitle:"Snapshots before claims, and cadence honesty",duration:"apify · actors · cadence-honesty",currentVersion:2,totalLearners:8,stuckLearners:0,objectives:["Describe what an actor run returns and what a snapshot keeps","Recognise when a source is not evidence (one voice, stale, or unreachable)"],prerequisites:["lesson-02-n8n-decision-layer"],quiz:[{id:"q1",question:"Actor outputs should be normalised into:",options:["screenshots","snapshots with hashes","embeddings"],correct:1,version:1},{id:"q2",question:"The honest latency unit for a scheduled crawler is:",options:["milliseconds","the scan cycle","not applicable"],correct:1,version:1},{id:"q3",question:"When two independent sources contradict, you:",options:["average them","escalate with both quotes","publish the newer"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Apify as the input layer

**Learning objective.** Turn real pages into hashed snapshots with pinned actors, and describe
your cadence honestly.

## Snapshots before claims
Fetch first, hash immediately, cache the bytes. Every later claim points at a byte range in that
cached file, so "the source said this" is checkable months later — or five minutes later when two
sources disagree.

## Cadence honesty
An actor is not a websocket. Runs take 30–120 s; a schedule has jitter. Say the configured interval
and the measured jitter; never say real-time. The honest number is *source captured → decision
made*, whatever it turns out to be.

- Where do you hash: before or after parsing? (before)

**Learning objective.** Turn real pages into hashed snapshots with pinned actors, and describe
your cadence honestly.

Fetch first, hash immediately, cache the bytes. Actor inputs are validated against the actor's input schema before a run starts. Every later claim points at a byte range in that

and the measured jitter; never say real-time. The honest number is *source captured → decision

atus:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Tool permissions and the human exit

**Learning objective.** By the end you can declare what an agent's tools may touch, prove it by
reading one settings block, and name the exit that brings a human in.

## Declared scope, not vibes
The tools, and their parameters, are declared in \`tool_permissions.tools\` in the workflow settings.
A model may *ask* for a tool; the runtime refuses anything outside the declared scope. The block is
the contract: if it is not in the settings, it does not exist.

## The three permission models
1. **Allowlist.** Only named tools run. Everything else is a refusal with a reason code.
2. **Human exit.** For irreversible calls (payments, outbound messages, deletes) the workflow waits
   for a human decision; the wait is visible on the execution.
3. **Blanket.** No. A blanket permission turns a prompt injection into a data-loss incident.

## Reading a settings block
\`\`\`json
{"tool_permissions": {"tools": ["http_request", "apify_run_actor"],
  "parameters": {"http_request": {"allow": ["docs.n8n.io", "docs.apify.com"]}}}}
\`\`\`
The allowlist above is host-scoped: a redirect to another host is a refusal, not a run.

## Stop conditions (the honest ones)
- No corroboration for a claim that would change behaviour.
- A tool outside the declared scope.
- A learner-facing message without consent on record.

**Learning objective.** Leave a chain of evidence, and write your own undo condition before you
are trusted with autonomy.

## Receipts are the memory
Every decision writes one append-only row: what was seen, the quotes, the judge's answers, the
action and reason codes, the artifact hashes, the cost. Hash-chain the rows and verify at the end of
every run. A decision without a receipt is a bug of the same severity as a wrong action.

## The falsification clause
No publish without a revert gate — the metric, threshold, cohort size and window that will make the
system restore the previous version. No revert without a satisfied gate, either: undo is a claim and
it needs evidence too.

## Practice
For your last change, write the gate you would have needed, and the moment you would have known.`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]},{id:"lesson-06-evals-that-survive",number:6,title:"Evals that survive a judge",subtitle:"Floor, traps, honest columns, and the legal degrade",duration:"evals · gold-set · traps · hostile-input",currentVersion:1,totalLearners:8,stuckLearners:0,objectives:["Separate a build-breaking metric from a nice-to-have metric","Design a trap fixture for the failure you fear most","Treat a hostile page as an input the system must refuse, not parse"],prerequisites:["lesson-05-receipts-and-reverts"],quiz:[{id:"q1",question:"The gold set floor in this course is:",options:["10 rows","40 rows","1000 rows"],correct:1,version:1},{id:"q2",question:"Which row must never publish?",options:["a corroborated rename","a page instructing the system","a new capability"],correct:1,version:1},{id:"q3",question:"Column (b) exists to show:",options:["the cost","what the rules add over the same models","the latency"],correct:1,version:1},{id:"q4",question:"Below the eval floor you should:",options:["extrapolate","print n and claim nothing","lower the floor"],correct:1,version:1}],versions:[{version:1,date:"authored (pre-run)",status:"PUBLISHED",authority:"PA3",generated:!1,reviewedBy:"author",body:`# Evals that survive a judge

**Learning objective.** Build a small eval with a floor, traps, and a legal way to say "I don't
know" — the three things that make numbers believable.

## Floor and traps
A frozen set of rows with hand-written labels: at least forty, including the traps — a hostile page,
a single source, contradictory sources, an unreachable source, an assessment change. Two numbers are
build-breaking: hostile→publish must be zero and unsupported→publish must be zero.

## Honest columns
Score the same rows three ways: a proprietary one-shot baseline, the same models with your rules
disabled, and your system. The middle column is the honest one — it shows what the rules add.

## Legal degrade
Below the floor, print the actual n and claim nothing. "Unmeasured" is a respectable value; a
plausible invented number is not.

## Practice
Write the two rows that would embarrass your system most, then make them trap rows.`,sources:["https://docs.n8n.io/","https://docs.apify.com/"]}]}],description:"Courserefresh keeps a course true to a moving subject: it notices when the world a lesson describes has changed, decides — by rulebook, on corroborated evidence — whether the lesson is now wrong, rewrites the lesson and its quiz when it is, tells the humans who opted in, watches whether the change helped, and reverts its own edit when it did not. Agent Ops is the subject course: six lessons on n8n + Apify + agents in production, chosen because its sources move during any build window.",lastUpdated:"2026.09.26",updateCadence:"scan 60 min · learn 15 min · digest 07:30 UTC",sources:["n8n GitHub releases","docs.n8n.io","npmjs n8n-nodes-base","apify.com/changelog","npmjs apify-client"],loopRuns:2,publishedChanges:2,refusedChanges:4,revertedChanges:1,dispatchedChanges:1,unchangedChanges:1},Gu=[ES],hu={heroRun:"cr-20260926-1726-793"},AS=`# Courserefresh digest — 2026.09.26T17:26:16Z

truth: settings that were renamed, APIs that were removed, practices already flagged as unsafe — discovered in the lab, or on the job."},{who:"The institution",pays:"Erosion: course reviews flag stale material every cycle; accreditation asks for currency; employers quietly discount the degree."}]},{id:4,type:"why",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"04 / 10",eyebrow:"Why this solution",title:"A chatbot watches. An alert feed watches. This acts.",body:"Everything else on the shelf observes; none of it takes responsibility for the course being correct. The gap is not awareness — it is accountable, evidenced action.",rivals:[{who:"A chatbot",gap:"passive",sees:"Answers questions when asked.",does:"Retells the course as written — including its mistakes. Rewrites nothing."},{who:"An alert feed",gap:"delegates back",sees:"Pings the lecturer when something looks relevant.",does:"Adds one more notification to an overloaded human. The queue grows; the course still rots."},{who:"CourseRefresh",gap:"accountable action",sees:"Watches the sources itself, every hour.",does:"Verifies, decides by rulebook, rewrites the lesson and quiz, notifies learners, measures the effect, and undoes its own bad edits."}],kicker:"Only the last one closes the loop — and every action carries a receipt."},{id:5,type:"how",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"05 / 10",eyebrow:"How it works",title:"Five steps, closing hourly. Each step is a real tool.",body:"The loop is small enough to explain in one breath and specific enough to audit in one afternoon.",phases:[{name:"WATCH",tool:"Apify",color:"#6B4E2E",desc:"Actors fetch the sources the course teaches — releases, docs, changelogs — every 60 minutes. Snapshots are hashed; unchanged sources produce no event."},{name:"FIND LEADS",tool:"Tavily",color:"#96550A",desc:"Search finds leads when a watched source is quiet. A lead is a candidate, never proof: its page must be fetched from its own publisher before it can count."},{name:"JUDGE",tool:"LLM + rulebook",color:"#7A5C00",desc:"A judge model scores each candidate against the closed rubric: relevance, agreement, quote support, injection risk. The judge proposes; the rulebook decides."},{name:"DECIDE + ACT",tool:"n8n",color:"#3F5A2A",desc:"The POLICY node — deterministic, one screen — returns one action with reason codes, then writes the versioned lesson, diff, quiz, and CHANGELOG commit."},{name:"REPORT",tool:"digest",color:"#5C564C",desc:"The teacher gets one digest: refusals first, then what changed, with receipts and undo. Consenting learners get a card with one-click opt-out."}]},{id:6,type:"rule",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"06 / 10",eyebrow:"The rule",title:"Two independent sources: it acts. One: it asks.",body:"Evidence is the whole game. The rule is simple enough to teach, strict enough to trust.",cases:[{sources:"≥ 2 independent sources agree",color:"#3F5A2A",outcome:"Updates the lesson on its own, notifies consented learners, keeps the undo attached."},{sources:"1 source, or sources disagree",color:"#96550A",outcome:"No publish. It asks the teacher — with the verbatim quote and the references attached."},{sources:"The page is hostile or injected",color:"#9B2C1F",outcome:"Stops at the gate. hostile→publish: 0 is a build-breaking invariant."}],independent:"What counts as independent: two pages from one publisher are one source. Mirrors (copies) and unfetched search hits never count — only the publisher’s own page does."},{id:7,type:"teacher",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"07 / 10",eyebrow:"What the teacher sees",title:"A before/after card — with the reason, the references, and a ruling that binds.",body:"The teacher is the recipient of the loop’s work, not its queue-jockey. Corroborated changes publish themselves with the undo attached; the card with an Approve question appears where a human must rule — conflicting sources, assessments, learner records.",stays:"For this change class the ruling is the teacher’s, and the system enforces its own refusal if the teacher is not there to give it.",card:{before:"The tools, and their parameters, are declared in tool_permissions.tools in the workflow settings.",after:"The tools, and their parameters, are declared in permissions.mode.tools in the workflow settings (renamed from tool_permissions in n8n 1.85).",reason:"n8n 1.85 renames tool_permissions to permissions.mode — release notes, docs, and the community package agree.",ref:"github.com/n8n-io/n8n/releases · docs.n8n.io · npmjs.com/package/n8n-nodes-base"}},{id:8,type:"safeguards",bg:"from-[#F3EFE7] to-[#EAE4D8]",label:"08 / 10",eyebrow:"The safeguards",title:"It stops. On weak evidence, on hostile pages, on its own bad edits.",body:"Designed to be auditable at 3am: every decision carries a reason code, a verbatim quote, and a receipt. The digest lists refusals first.",advantages:[{icon:"⊘",title:"Acts alone only when sources agree",desc:"≥2 independent sources or no publish — last night the single-source case asked the teacher instead (receipt: insufficient_corroboration)."},{icon:"↺",title:"Logs and can undo everything",desc:"Every publish carries a revert gate. Last night the loop measured its own edit, found quiz_delta −0.04 at n=6 over 60h, and restored the previous version unprompted (receipt: revert_gate_satisfied)."},{icon:"⚑",title:"Handles failures as first-class outcomes",desc:"Unreachable source, contradictory sources, budget spent: each is a receipted refusal, never a silent skip. The digest lists what it refused, first, with reasons."},{icon:"⏻",title:"A kill switch, printed in every digest",desc:"The digest reports its own emergency stop every morning (kill switch: off). Flip it and the loop drains to a halt: no scans, no writes, no mail."}]},{id:9,type:"proof",bg:"from-[#EAE4D8] to-[#F3EFE7]",label:"09 / 10",eyebrow:"Proof from last night",title:"One unattended run. Nine receipts. All four refusals earned.",body:"Everything on this slide is printed by the run itself — mode: sim (fi
