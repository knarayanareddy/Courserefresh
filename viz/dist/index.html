rcpt-26-793-000 · PUBLISH · [corroborated_change] · authority PA2 · decided_by policy-node
inputs:   materiality=material_breaking · sources_verified=2 · injection=0.02 ·
          conflict=false · assessment=false · budget=18.4/25 · gate=armed
policy:   sha256:9c1f… (v0.3) · rules evaluated: R1✗ R2✗ R3✗ R4✗ R5✗ R6✗ R7✗ → R8
artifact: lesson-04 v3→v4 · diff_hash 2ba669… · quiz q2 regenerated
canvas:   execution_id 8fA2… · prev rcpt-26-793-009
\`\`\`

The \`rules evaluated\` line is parity in miniature: any reader can replay R1–R7 by
hand from the inputs row and land on R8 — the receipt *teaches its own decision*.
Post-mortems stop being arguments about intent and become reading exercises.

## 4b. A worked trace, rule by rule

\`\`\`
in:  materiality=material_breaking · sources_verified=1 · injection=0.02
     conflict=false · assessment=false · budget=3/25 · action_requested=PUBLISH
R1?  0.02 < 0.5 ……………………………………………… R1 no
R2?  sources_verified=1 < 2 ……… R2 FIRES
→ ESCALATE [insufficient_corroboration] · claim preserved for the human
\`\`\`

Compare with the same input at \`sources_verified=2\`: R1–R7 all fall through, R8
publishes with \`[corroborated_change]\`. One predicate of difference, two receipts,
two different worlds — that is the whole policy in one breath, and the pencil-
simulation drill from §1 is how you make it reflex.

## 5. Common mistakes

1. **Reordering "for efficiency."** Moving R6 before R4 lets a cosmetic-but-
   assessment-touching change NO_CHANGE its way past the PA3 wall. Order is
   semantics; it is never a performance question.
2. **One runtime, vibes for the other.** "The Python is basically the same" —
   parity exists because "basically" is where incidents live. Zero disagreements
   is a floor, not a stretch goal.
3. **Open reason codes.** A bespoke \`"kind_of_dubious"\` code breaks digest
   aggregation and every test that asserts codes. Taxonomy changes are
   amendments.
4. **Dismissing the default's reason.** \`corroborated_change\` on R8 output is not
   decoration: it asserts the conditions every refusal rule checked and passed.
   A default without its reason is unaccountable optimism.

## Recap and practice

You can recite R1–R8 with the priority argument, simulate any input by hand, read
the \`rules evaluated\` line, and explain what parity proves about the canvas.

**Practice (the pencil drill, all three):**
1. \`injection=0.93, sources_verified=2, materiality=material_breaking\` → 
   *(R1 fires: ESCALATE [injection_or_jailbreak]. Good corroboration of a hostile
   page is still a hostile page.)*
2. \`injection=0.02, sources_verified=2, conflict=true, materiality=material_breaking\` →
   *(R3 fires — before R4–R8 are even consulted. Conflict → human.)*
3. \`injection=0.02, sources_verified=2, materiality=cosmetic, budget=24/25\` →
   *(R5 no budget problem — 24/25 not exceeded; R6 fires: NO_CHANGE
   [below_materiality]. A change that "merely" rewords is correctly refused.)*`,objectives:["Order the policy rules R1–R8 and predict the action for a given input, first match wins","Explain parity testing: the same rules in JavaScript on the canvas and Python in tests, with zero disagreements allowed"],prerequisites:["lesson-14-observe-and-judge"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-15-policy-node-q1",version:1,question:"Order the reasons: why does the injection rule R1 come FIRST?",options:["It is the cheapest check","It is the oldest rule","Alphabetical ordering","A hostile page cannot be rescued by good corroboration later in the list; suspicion is raised, never lowered — safety outranks evidence quality"],correctIndex:3,explanation:"First-match-wins means order is semantics: safety first, then evidence sufficiency, then economy — a well-corroborated hostile page is still a hostile page. (obj-15-a)",objectiveRef:"obj-15-a"},{id:"lesson-15-policy-node-q2",version:1,question:"Input: injection 0.02, sources_verified 2, conflict true, materiality material_breaking. What fires?",options:["R6 NO_CHANGE","R3 ESCALATE [source_conflict] — conflict is checked BEFORE the publish default; two good voices disagreeing needs a human","R8 PUBLISH — the change is well corroborated and material","R4 assessment_integrity"],correctIndex:1,explanation:"Walk the rules in order: R1 no (0.02 < 0.5), R2 no (2 voices), R3 FIRES. The publish default never runs. (obj-15-a)",objectiveRef:"obj-15-a"},{id:"lesson-15-policy-node-q3",version:1,question:"What does PARITY testing prove about the canvas?",options:["That the canvas is faster than Python","That the two implementations are basically similar","That the JavaScript rules on the canvas and the Python oracle produce bit-for-bit identical actions and reason codes on every gold row — the canvas is provably the decision maker, and the offline twin is not a mock","That Python is the production runtime"],correctIndex:2,explanation:"'Basically the same' is where incidents live: zero disagreements is the floor, and it is what lets a receipt carry canvas.execution_id and be believed. (obj-15-b)",objectiveRef:"obj-15-b"},{id:"lesson-15-policy-node-q4",version:1,question:"Adding a new policy rule requires, in order:",options:["Add the rule to BOTH runtime mirrors, add gold rows exercising it, run the parity test, release — four steps, no exceptions","Add it to the JS side; mirror it next sprint","Disable the old rules and A/B test","Ship it; add tests if time permits"],correctIndex:0,explanation:"The discipline is the same for thresholds and rules: both mirrors, coverage rows, parity green, then release — the receipt history shows the discipline held. (obj-15-b)",objectiveRef:"obj-15-b"}],versions:[]},{id:116,slug:"lesson-16-receipts-and-chains",title:"Lesson 16 — Receipts, diffs & hash-chained memory",version:1,body:`# Receipts, diffs & hash-chained memory

**Learning objective.** Read a receipt: input, decision, reason codes, preserved quotes, artifact hashes; explain how a hash chain makes an action arguable after the fact — and what verify_chain proves.

## 1. The receipt: one decision, one row, everything

A receipt is the atomic unit of accountability: **every decision — publish,
refusal, dispatch, signoff, error — writes exactly one append-only record**, and
every record carries enough to reconstruct and dispute the decision without the
system's help:

\`\`\`
{ "receipt_id": "rcpt-26-793-000",
  "ts": "2026-09-26T17:26:16Z",
  "run_id": "cr-20260926-1726-793",
  "event_id": "cr-n8n-rename-01",
  "mode": "sim",                       // live · sim · degraded — always labelled
  "decision": {
    "action": "PUBLISH",
    "reason_codes": ["corroborated_change"],
    "authority": "PA2",
    "decided_by": "policy-node"
  },
  "inputs": {                          // the full DecisionInput, verbatim
    "materiality": "material_breaking", "sources_verified": 2,
    "injection_score": 0.02, "quotes": ["The tool-permission setting is now …"],
    "policy_sha": "9c1f…", "gate": {"metric": "quiz_delta", "condition": "<= 0",
                                     "n_min": 5, "window_h": 48}
  },
  "artifact": {                        // what the action did — or would have
    "lesson_id": "lesson-04-tool-permissions", "from": "v3", "to": "v4",
    "diff_hash": "2ba669…", "quiz_regen": "q2"
  },
  "prev": "rcpt-26-793-009:key:5f2…"   // chain link — see §3
}
\`\`\`

Three design rules make receipts worth their bytes:

1. **Inputs verbatim, not summarised.** The receipt records the full DecisionInput
   — the quotes *as anchored*, the scores as scored, the policy hash as running. A
   summarised input is a paraphrase, and paraphrases are the enemy of
   arguability.
2. **Refusals are first-class.** An ESCALATE receipt preserves the claim and its
   quote even though nothing was published — *especially* because nothing was
   published. The human reviewing the escalation needs the exact evidence, and
   the digest aggregates refusals by their reason codes.
3. **The receipt precedes the action.** For writes, the receipt is written before
   (or atomically with) the artifact; an action without its receipt is a defect
   the chain check catches. Contrast with "we logged it after, if we remembered."
    Receipt coverage — decisions with receipts / decisions — is a contract-tested
   **100%**, not a best-effort percentage.

## 2. Diffs: the action's face

The artifact section names versions (\`v3 → v4\`) and the diff hash; the diff file
itself (\`diffs/v4.diff\`) is the human-readable face of the action. Rules:
**every** publish writes a new version — no in-place edits (Lecture 03); the diff
is computed and hashed at write time (the hash into the receipt prevents
after-the-fact diff tampering); and reverts are versions too — v5 restoring v3 is
*a new version with its own receipt and diff*, not a magical undo (Lecture 18).
The changelog row ties receipt, diff and motivation together in the course's
public history.

## 3. The chain: hash-linked receipts

Receipts link: each carries \`prev: <prior receipt id + hash>\`. The result is a
tamper-evident log — the same construction as a blockchain's spine, minus the
ceremony:

\`\`\`
genesis → r-000 → r-001 → r-002 → … → r-008   (the hero run's 9 rows)
             │        │        │
             └─ verify_chain() recomputes each link hash and
                checks: no gaps, no rewrites, no insertions
\`\`\`

**What the chain proves — and what it does not.** \`verify_chain() == true\` at run
end proves the *log's integrity*: every receipt is still exactly what the system
wrote, in the order it wrote it, since genesis. It does **not** prove the
decisions were *right* (that is what the eval's gold rows are for) — it proves
nobody edited history. The distinction matters and is worth reciting: **the chain
is memory integrity; the gold set is decision quality.** Together they make an
action *arguable*: "here is exactly what was decided, on exactly what evidence,
and here is a labelled suite proving the decision rule."

The attack model makes the design concrete: with an append-only plain log, an
intruder (or a well-meaning colleague) can rewrite Saturday's receipt to hide a
bad publish; the next \`verify_chain()\` fails at the broken link and the digest
names the gap. Silence is defeated structurally — which is why **chain integrity
is a run-end contract**: every cycle ends with the check, and the digest prints
it (\`chain ✓ 9 rows\`), so even the *checker's* absence is visible on the one page
the operator reads.

## 4. Reading the chain in an incident

The post-incident drill (lab 16 runs it end to end):

1. **Anchor at the artifact.** Start from the world — the lesson version, the
   diff — and find the receipt naming its hash.
2. **Walk backward.** Each receipt names its predecessor; inputs quote
   snapshots; snapshot hashes open files. Every hop is verifiable because every
   hop is a hash.
3. **Replay the policy.** The \`inputs\` row + the policy hash replay the decision
   by hand (Lecture 15's pencil drill). If the replay disagrees with the
   recorded action, *the incident is in the policy*, and the policy version is
   pinned in the receipt.
4. **Read the mode labels.** A sim receipt must never masquerade as live; the
   label rides every row, and the honest post-mortem names it.

Four hops: world → receipt → evidence → rules. No step trusts memory, a colleague's
recollection, or the system's own current state — only hashes and files.

## 5. Common mistakes

1. **Logging after the fact.** "We'll write the receipt in the digest pass."
   Between action and log lies a window where the system did something
   unaccounted. Write first, act on the receipt's tail.
2. **Summarised inputs.** Compact receipts are beguiling and useless in disputes.
   Verbatim inputs (with anchored quotes) are the entire point.
3. **Unhashable artifacts.** A receipt naming \`diff_hash\` nobody can recompute —
   or a snapshot the receipt doesn't address — breaks the verification grammar.
   Every artifact reference is a hash address, or it is a description.
4. **Chains without checks.** The chain that nobody verifies is a ritual.
   \`verify_chain()\` at run end, printed in the digest, tested in CI — or don't
   bother linking.
5. **The receipt as self-praise.** Logs that say "successfully updated the
   lesson!" are marketing. Receipts carry inputs and decisions; interpretation
   belongs to the digest and the humans.

## Recap and practice

You can read a receipt's five sections, follow the chain links, and run the
four-hop incident drill; you can state precisely what verify_chain does and does
not prove.

**Practice:** (a) In the receipt above, the gate is recorded inside \`inputs\` — why
must the gate live in the receipt rather than "in the system"? *(Because
Lecture 18's revert is *evidenced* by the gate that was recorded at publish
time; a gate that lives only in current state can be edited to match the outcome
it wants.)* (b) For your capstone, define the five receipt sections in one line
each — then write the Chain test: how exactly does your \`verify_chain()\` fail
when someone edits a middle row? Saying "it hashes differently" is the start;
trace which link breaks and what the digest prints.`,objectives:["Read a receipt: input, decision, reason codes, preserved quotes, artifact hash","Explain how a hash-chained receipt log makes an action arguable after the fact, and what verify_chain proves"],prerequisites:["lesson-15-policy-node"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-16-receipts-and-chains-q1",version:1,question:"Which receipt section carries the verbatim quotes and policy hash the decision ran under?",options:["inputs — the full DecisionInput: quotes as anchored, scores as scored, the policy version hash, and the gate as armed","artifact","decision (action and reason codes only)","prev (the chain link)"],correctIndex:0,explanation:"Inputs verbatim is the design rule: a summarised input is a paraphrase, and paraphrases are the enemy of arguability. (obj-16-a)",objectiveRef:"obj-16-a"},{id:"lesson-16-receipts-and-chains-q2",version:1,question:"Why are REFUSAL receipts first-class — full artifacts with the claim and quote preserved — even though nothing was published?",options:["Because the human reviewing the escalation needs the exact evidence, and the refusal is precisely the decision that must be arguable after the fact","To pad the chain length","Refusals are cheaper to store","For statistics"],correctIndex:0,explanation:"'Nothing was published' is the most-scrutinised decision class: an unauditable refusal is indistinguishable from a bug. (obj-16-a)",objectiveRef:"obj-16-a"},{id:"lesson-16-receipts-and-chains-q3",version:1,question:"What does verify_chain() == true actually prove?",options:["That the digest was sent on time","That the log is intact — every receipt is exactly what the system wrote, in order, since genesis: memory integrity, not decision quality (that's the gold set's job)","That every decision was correct","That the system is within budget"],correctIndex:1,explanation:"Chain = memory integrity; gold = decision quality; together they make an action arguable. The distinction is worth reciting under questioning. (obj-16-b)",objectiveRef:"obj-16-b"},{id:"lesson-16-receipts-and-chains-q4",version:1,question:"Someone edits Saturday's receipt to hide a bad publish. What happens at the next verify_chain() run?",options:["The edit propagates to the digest silently","The link-rehash fails at the tampered row; the check reports the broken link, and the digest names the gap — tampering is detected, not prevented","Nothing — the log is append-only so edits are impossible","The whole chain re-hashes to match"],correctIndex:1,explanation:"The chain is tamper-EVIDENT: the rewrite breaks the cryptographic link to the next row, and the integrity check turns the edit into a visible incident. (obj-16-b)",objectiveRef:"obj-16-b"}],versions:[]},{id:117,slug:"lesson-17-tool-permissions",title:"Lesson 17 — Tool permissions & the human exit",version:1,body:`# Tool permissions & the human exit

**Learning objective.** Write a least-privilege tool permission block for one agent, host-scoped where applicable; name the conditions that must stop the agent and bring in a human — and why consent is one of them.

## 1. Declared scope, not vibes

Everything from Lecture 02 onward has assumed the runtime can refuse. This is the
lecture where refusal gets *declared*. An agent's capabilities are a config, not a
personality:

\`\`\`json
{ "tool_permissions": {
    "tools": ["http_request", "apify_run_actor"],
    "parameters": {
      "http_request": { "allow": ["docs.n8n.io", "docs.apify.com"] }
    }
  }
}
\`\`\`

The contract is absolute: **if it is not in the block, it does not exist.** A model
may *ask* for a tool (propose an action that needs it); the runtime refuses
anything outside the declared scope. The block is the difference between an agent
you operate and a process you hope about. And the block is *versioned*: n8n's own
setting surface moved (the \`tool_permissions\` → \`permissions.mode\` rename, which
the running case study receipted and its quiz regenerated on) — your permission
model is an artifact with a history, exactly like the rules and the thresholds.

## 2. The three permission models — and the one that's forbidden

| Model | Meaning | Verdict |
|-------|---------|---------|
| **Allowlist** | Only the named tools, only the named hosts, run | The default posture — everything else is a refusal with a reason code |
| **Human exit** | Irreversible-adjacent actions *wait* for a human decision; the wait is visible on the execution | Required for the PA3 tier: assessments, records, deletes, payments |
| **Blanket** | "The agent has all tools; it's smart enough" | **No.** A blanket permission converts the next prompt injection into a data-loss incident (Lecture 04, Species 1). There is no smart enough — there is only declared scope |

Note the subtlety in the allowlist example: \`http_request\` is **host-scoped** —
\`docs.n8n.io\` and \`docs.apify.com\` are allowed; a redirect to
\`metrics-collector.example\` is a *refusal*, not a fetch. Host scoping matters
because the web's natural behavior is to bounce you places you didn't ask to go,
and exfiltration's favorite shape is "it just followed a redirect."

## 3. Writing the block (the lab exercise, condensed)

Least privilege by subtraction, in order:

1. **Enumerate the agent's jobs.** For the running case study: read sources (actor
   + http), decide (code, in-canvas), write one branch of one repo (github), post
   one message type to one chat (telegram).
2. **Grant one tool per job, scoped to the narrowest parameter set that works.**
   \`github\` → one repo, one branch (\`bot/courserefresh\` — the human owns \`main\`);
   \`telegram\` → one chat id, templated card only.
3. **Host-scope every fetch-shaped tool.** Allowlist of publisher domains, from
   the same source config the independence model uses — the permission block and
   the source plan are two views of one allowlist.
4. **Never grant** shell/exec, filesystem-wide writes, credential *read* (as
   opposed to *use*), or "all hosts." Each of those crates has a lock on it for
   reasons Lecture 04 catalogued.
5. **Write the refusal paths.** For each tool, what does the system do when the
   ask is out of scope? (ESCALATE / \`tool_out_of_scope\` + receipt + preserved
   input. A refusal without a receipt is Lecture 08's silence in a permission
   costume.)

The self-test for any block: **"Here is where it refuses."** If you cannot point
at the line, you don't have least privilege — you have a draft. (This is the same
sentence a judge asks for, and the lab grades it literally.)

## 4. The human exit: conditions that stop the world

The stop conditions from Lecture 04, now as *declared, tested config* — with
consent promoted to first-class, because the last lectures of the course depend
on it:

1. **Missing consent.** A learner to be contacted with no consent row → refuse,
   receipt (\`consent_missing\`), and *the block itself is auditable*: the refusal
   receipt proves the wall held. Consent is a permission on **people**, not just
   data — the symmetric twin of the tool allowlist.
2. **Assessment touched.** Anything that alters what is graded, or records about
   a person → PA3, human-only, with the wait visible on the execution.
3. **Irreversible actions.** Deletes, payments, outbound mail beyond the
   consented templates → human exit.
4. **Out-of-scope tool request.** The runtime refuses; the receipt preserves what
   was requested.
5. **Unknown state.** Missing inputs, failed validation → escalate
   (\`unknown_state\`), fail closed (Lecture 07's boundary guard).

Design note: the human exit is **visible**, not merely present. "Waiting for
human" appears on the execution, in the receipt stream, and in the digest's
escalation section. An exit nobody can see is an exit nobody takes — and the
queue of waiting escalations is itself an operational metric (Lesson 22's digest
names it).

## 5. Common mistakes

1. **Blanket grants "for the demo."** The demo is exactly when the injection
   specimen arrives. PA3-with-no-exceptions exists because demos create pressure
   to make exceptions; the pressure is the attack.
2. **Key-scoped but not host-scoped.** An \`http_request\` with a valid credential
   but no host allowlist is a open door with a gold handle: the credential
   proves *you* are allowed, not that *the destination* is.
3. **Silent refusals.** Refusing without receipting is invisible governance —
   indistinguishable from a bug. Every refusal is an artifact.
4. **Confusing consent with notification.** "We told them we'd message them" ≠
   "they said yes." Consent is a recorded, versioned, per-learner row — Lecture
   19 builds the full wall; this lecture's block merely enforces it.

## Recap and practice

You can write a scoped allowlist with refusal paths, and enumerate the five
stop-condition families with consent among them.

**Practice:** write the block for your capstone agent (tools, per-tool parameters,
hosts, branches, chats — writing down the refusal receipt each produces). Then
stress it: what exact sequence would make your agent (a) write to the protected
branch, (b) message a non-consenting human? For each, name the *line* that
refuses. If either sequence has no refusing line, you have found your lab's first
bug — fix the block, not the prompt.`,objectives:["Write a least-privilege tool permission block for one agent, host-scoped where applicable","Name the conditions that must stop the agent and bring in a human, and say why consent is one of them"],prerequisites:["lesson-16-receipts-and-chains"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-17-tool-permissions-q1",version:1,question:"An agent may call http_request, but its parameters restrict hosts to {docs.n8n.io, docs.apify.com}. A model-driven step follows a redirect to metrics.example. What happens?",options:["The fetch proceeds; redirects are normal web behaviour","The runtime REFUSES — host scoping means a bounce to an unlisted host is a refusal, not a fetch","The fetch proceeds and logs a warning","The workflow retries on the original host"],correctIndex:1,explanation:"Host scoping closes exfiltration's favorite shape ('it just followed a redirect'): the credential proves YOU are allowed, the allowlist decides whether the DESTINATION is. (obj-17-a)",objectiveRef:"obj-17-a"},{id:"lesson-17-tool-permissions-q2",version:1,question:"Which grant belongs in an allowlist for the case-study agent?",options:["credential READ access so the agent can rotate keys","github → one repo, one branch (bot/courserefresh); telegram → one chat, one templated card","all tools, read-write, for flexibility","filesystem-wide writes"],correctIndex:1,explanation:"One tool per job, scoped to the narrowest parameters that work; the credential crate and the exec crate stay locked. (obj-17-a)",objectiveRef:"obj-17-a"},{id:"lesson-17-tool-permissions-q3",version:1,question:"The self-test for any permission block is the sentence:",options:["'The audit log will catch problems.'","'Here is where it refuses.' — if you cannot point at the refusing line, you have a draft, not least privilege","'It would never do anything harmful.'","'The model was instructed to be careful.'"],correctIndex:1,explanation:"A pointed-at refusal line per dangerous sequence is the lab's grading criterion, and the same sentence a security judge asks for. (obj-17-a)",objectiveRef:"obj-17-b"},{id:"lesson-17-tool-permissions-q4",version:1,question:"Why is MISSING CONSENT listed among stop conditions alongside assessment-touched and out-of-scope tools?",options:["Because messages cost money","Consent is a permission on PEOPLE — the symmetric twin of the tool allowlist: no consent row → no storage, no contact, refusal receipted (consent_missing) so the wall's hold is auditable","Because Telegram requires it","Because consent speeds up delivery"],correctIndex:1,explanation:"The permission model governs two domains: what the agent may touch (tools) and whom it may touch (people). Both fail closed, both are receipted. (obj-17-b)",objectiveRef:"obj-17-b"}],versions:[]},{id:118,slug:"lesson-18-revert-gates",title:"Lesson 18 — Revert gates: publishing means promising to undo",version:1,body:`# Revert gates: publishing means promising to undo

**Learning objective.** Write a revert gate at publish time — metric, threshold, cohort minimum, deadline — and distinguish open, satisfied and unmeasured gates and what each obliges the system to report.

## 1. Falsification, borrowed from science

A course update is a hypothesis: "this new version is better than the old one."
Science's hardest-won habit is that hypotheses must be **falsifiable** — the
experimenter writes down, *in advance and in public*, the observation that would
prove the hypothesis wrong. Courserefresh imports the habit wholesale: at publish
time, the system writes a **gate** — the pre-registered condition under which it
will undo its own work:

\`\`\`json
{ "metric": "quiz_delta",   "condition": "<= 0",
  "n_min": 5,               "window_h": 48 }
\`\`\`

- **metric** — what gets measured after learners interact (\`quiz_delta\`, or for
  other subjects \`completion_delta\`, \`stuck_rate_delta\`)
- **condition** — the value at/below which the gate *fires* (quiz scores did not
  improve: the change is presumed harmful or useless)
- **n_min** — the cohort floor: measurements below it cannot act (small-n
  arithmetic is noise; Lecture 21 generalises the discipline)
- **window_h** — the evaluation deadline: gates are time-boxed, not eternal

The gate is recorded **inside the publish receipt's inputs** (Lecture 16's §) —
written *before* any learner touches the new version, immune to post-hoc
rationalisation. A gate written after the data arrives is not a gate; it's a
press release.

> **Publishing means promising to undo.** The promise is the artifact that makes
> an autonomous edit ethical: the system grants the world the right to prove it
> wrong, and binds itself to obey.

## 2. The three states

Every gate is, at any moment, in exactly one of three states — and the digest
reports each differently because each obliges something different:

| State | Meaning | System obligation |
|-------|---------|-------------------|
| **open** | Window running; not enough data yet | Report it exists, with deadline. No action, no claims |
| **satisfied** | Metric crossed the condition **with n ≥ n_min** inside the window | **Auto-revert** — restore the prior version as a *new version*, receipt \`revert_gate_satisfied\`, notify the same cohort that received the publish. No human in the loop: the promise executes |
| **unmeasured** | Window elapsed with n < n_min (or telemetry lost) | Report \`unmeasured\` with n and the values seen. **No revert claim, no harm claim.** The honest sentence: "we could not tell whether the change helped" |

The \`unmeasured\` state is the one that separates operated systems from marketing
systems: it is *always available*, always tempting to skip, and always reported.
"Quiz delta +12% (n=3)" is a number pretending to be evidence; n=3 is a report,
not an action. The system never conflates the two — a claim without its n is a
hype violation (Lecture 21's claims lint makes the same rule syntactic).

## 3. What a revert actually is (and is not)

A revert is **not an undo**. It is a **new version whose content restores the
prior one**, with everything a publish has:

\`\`\`
lesson-04/
  v3.md          original
  v4.md          the publish (2026-04-18, gate: quiz_delta <= 0, n>=5, 48h)
  v5.md          the REVERT of v4 (2026-04-20, receipt rcpt-26-793-008)
  diffs/v4.diff  (+) and (-) of the publish
  diffs/v5.diff  the revert's own diff
  CHANGELOG.md   both rows, both receipts
\`\`\`

Why a new version rather than an undo? Because **the revert must itself be
arguable**: it gets a receipt (satisfying the *recorded* gate — the receipt
quotes the gate *as written at publish time*), a diff (restoring v3's text is
itself a change to the current), and a notification to the same cohort ("the
change you were told about has been undone, here is why"). History never
rewrites; it appends the correction. (This is Lecture 16's chain discipline
applied to the system's own mistakes.)

And the discipline cuts both ways — **a revert on vibes is forbidden**. An author
feeling the change "seems wrong" does not fire the gate; the metric does, with n.
The human override exists but is *honest about being human*: override receipts
say \`decided_by: human:<name>\` (and the tasteful version adds a reason in prose).
Machine promises revert by rule; humans revert by authority and say so.

## 4. The lifecycle, end to end

\`\`\`
publish v4 ──▶ gate armed (in receipt) ──▶ LEARN workflow evaluates every 15 min
                │                              │
                │                         n < 5 by 48h ──▶ digest: "UNMEASURED (n=3,
                │                              │            required 5, window elapsed)"
                │                         quiz_delta <= 0 at n >= 5
                │                              │
                ▼                              ▼
        cohort notified of v4        REVERT: v5 = content of v3 · receipt
                                       · notify cohort · ladder resets to PA1
\`\`\`

Two production details from the trace: the **ladder resets on revert** (Lecture
02's earned-authority rule: one bad publish un-earns notify privileges until
three clean publishes re-earn them), and the **same cohort** is notified — a
learner told "lesson 4 changed" who is never told "it changed back" has been
abandoned in a version that no longer exists.

## 4b. Reverts earned, not begged

The trace above is real: the running case study published v4 on corroborated
evidence (receipt rcpt-26-793-000), armed the gate, and two days later the gate
fired — \`quiz_delta −0.04 at n=6 after 60h\` — and restore v3 *unprompted*
(receipt rcpt-26-793-008). Nobody noticed the mistake first; the promise did.
When judges ask "what happens when it's wrong?", the answer is this receipt —
not a promise to be careful.

## 5. Common mistakes

1. **The unmeasured dodge.** Reporting "gate did not fire" without the n —
   smuggling a satisfied-looking report out of an n=2 window. Unmeasured is
   printed with its n, every time, or the system is claiming what it cannot
   know.
2. **Gates as decoration.** Arming gates that nobody evaluates (no LEARN pass,
   no digest line) — the promise exists but never executes; a gate unwired to
   its evaluator is a lie with JSON formatting.
3. **Revert-as-undo.** Deleting v4 and renaming v5→v4 breaks the chain, the
   diffs, and the trust. Append corrections; never rewrite history.
4. **The vibes revert.** An author's discomfort is an escalation, not a revert
   trigger. Rules revert; humans override and *say so*.
5. **One gate to rule all publishes.** Gates are per-publish: each publish
   carries its own pre-registered condition. Reusing last night's gate for this
   morning's publish is measuring the wrong thing confidently.

## Recap and practice

You can write the four-field gate, recite the three states with their
obligations, and explain why the revert is a versioned, receipted append.

**Practice:** (a) Write the gate for your capstone's first publish, then answer
the adversarial question: what would a hostile reviewer say is wrong with
\`n_min: 2, window_h: 4\`? *(n=2 acts on noise; a 4-hour window on a subject whose
learners study weekly measures nothing — say so before they do: your honest
print is unmeasured.)* (b) Your gate fires while the system sits at PA2. Walk the
full consequence chain — reverting, receipting, notifying, ladder — and *name the
authority level at which the revert executes* (it is not PA2; think about who
promised).`,objectives:["Write a revert gate at publish time: metric, threshold, cohort minimum and deadline","Distinguish open, satisfied and unmeasured gates, and what each obliges the system to report"],prerequisites:["lesson-17-tool-permissions"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-18-revert-gates-q1",version:1,question:"The four fields of a gate, as written at publish time, are:",options:["metric, condition, n_min (cohort floor), window_h (deadline)","branch, repo, token, chat","action, actor, timestamp, reason","model, prompt, temperature, budget"],correctIndex:0,explanation:"What gets measured, the firing condition, the cohort floor that keeps small-n noise from acting, and the time box. (obj-18-a)",objectiveRef:"obj-18-a"},{id:"lesson-18-revert-gates-q2",version:1,question:"Why is the gate recorded INSIDE the publish receipt rather than in the system's mutable state?",options:["State stores are expensive","Receipts are faster to read","The digest requires it","A gate that lives only in current state can be edited to match the outcome it wants; the recorded gate is pre-registered before any learner data exists — a promise immune to post-hoc rationalisation"],correctIndex:3,explanation:"Publishing means promising to undo; the promise must be unfalsifiable-by-the-system itself — hence recorded at publish time in the chain. (obj-18-a)",objectiveRef:"obj-18-a"},{id:"lesson-18-revert-gates-q3",version:1,question:"A gate window elapses with n=3 (n_min 5). What does the digest print?",options:["'UNMEASURED (n=3, required 5)' — no revert claim, no harm claim; the honest sentence is 'we could not tell whether the change helped'","Nothing; the gate waits another 48h","Gate satisfied — reverting","Gate failed — escalate to author"],correctIndex:0,explanation:"Unmeasured is a state with obligations: print it with its n, make no claim either way — small-n arithmetic is noise, and the system refuses to launder it into evidence. (obj-18-b)",objectiveRef:"obj-18-b"},{id:"lesson-18-revert-gates-q4",version:1,question:"In what sense is a revert 'a new version'?",options:["The old version is deleted and the prior restored by rename","The git history is rolled back","It is logged as a NO_CHANGE","It is recorded as v(N+1) whose content restores the prior version, with its own receipt, diff, and cohort notification — history appends the correction, never rewrites"],correctIndex:3,explanation:"The revert must itself be arguable: receipt quoting the recorded gate, diff of the restoration, notification to the same cohort. Deleting v4 would break the chain and abandon learners in a version that no longer exists. (obj-18-b)",objectiveRef:"obj-18-b"}],versions:[]},{id:119,slug:"lesson-19-telemetry-and-consent",title:"Lesson 19 — Learner telemetry & the consent wall",version:1,body:`# Learner telemetry & the consent wall

**Learning objective.** Define the two stuck signals and what each means; explain consent-first storage — no consent row means nothing is stored, and the refusal is itself receipted.

## 1. The promise that justifies watching

The brief the whole case study answers has two halves: "update as the subject
changes" (Modules II–IV) and "**spot when a learner is stuck before they ask**"
(this module). Watching learners is the most ethically loaded thing this course
builds — which is why it gets the strictest architecture in the repository: watch
two signals, store almost nothing, and touch a human only with recorded consent,
under caps that live in code.

The signals, defined before any data arrives:

1. **\`consecutive_wrong ≥ 2\`** — two wrong answers in a row, within one lesson
   session, on items tagged with the same concept. Interpretation: the learner is
   acting on a misconception, not guessing (one wrong answer is noise; two in a
   row on the *same concept* is a pattern with a name).
2. **\`dwell ≥ 3× the learner's own median\`** — time on a section at triple their
   personal median without reaching an attempt. Interpretation: the section lost
   them (or delighted them — the signal is a *moment for help, not a verdict*;
   the design vocabulary is deliberately non-judgmental: stuck, never "struggling"
   or "failing").

Both thresholds are **per-learner**, not cohort-global: a fast reader's 3× and a
careful reader's 3× are different wall-clocks, which suppresses the classic
"penalising thoroughness" false positive.

## 2. The consent wall

The rule is one sentence and the architecture is absolutely literal about it:

> **Consent precedes storage. No consent row → no storage, no contact — and the
> refusal itself is receipted.**

\`\`\`
telemetry POST {learner_handle, quiz_attempt · dwell, consent: true|false|absent}
  → consent false/absent: HTTP 403 · receipt [consent_missing] · nothing stored
  → consent true:         HTTP 200 · row stored · receipt written
\`\`\`

Design details that make it a *wall* and not a policy statement:

- **Fail-closed.** No row matches "not consented". Missing, malformed, stale —
  all refuse. The wall's default is no. (This is Lecture 07's unknown-state
  posture applied to people instead of data.)
- **The refusal is an artifact.** When a stuck learner without consent would have
  been helped, the refusal receipt (\`consent_missing\`) proves the wall held —
  *auditable ethics*. The running repo's hero run contains exactly this receipt,
  preserved deliberately: block, receipt, silence toward the human.
- **Consent is versioned and pseudonymous.** The consent record carries its form
  version hash; handles are hashed (\`learner:<sha256[..8]>\`) — *no names in logs,
  receipts, digests, or the demo, ever*. The ask itself is a ≤45-second script
  including the stop mechanism, what's tracked (quiz attempts, time), what
  happens to data (deleted at pilot end / 14 days), and that nothing is graded.
- **Opt-out changes nothing about access.** Refusing telemetry never costs a
  learner the course. The refusal is a *normal outcome, reported as a count*
  (\`telemetry_rejected\`) — not a failure to convert.

## 3. What is stored — and never stored

Stored per consented learner, the minimum the signals need: handle, attempts
(concept, right/wrong, ts), dwell samples, consent version, message caps state.
**Never stored:** names, contact details, grades as scores (micro-lessons are
never graded — §V of the plan), free-text anything, or anything the two signals
do not strictly need. Aggregates print only at n ≥ 3; a delta is never shown
without its n and window (Lecture 18's honesty rule, generalised to people).

The deletion rule is boring and absolute: 14 days or pilot end, whichever first,
plus deletion on request at any time. Boring is the point — the ethics lives in
the schema, not in a privacy policy PDF nobody reads.

## 3b. The ethics floor, restated as code

Because the learner loop is the risk, its guardrails exist as testable config,
not culture:

1. Consent precedes storage (fail-closed, receipted refusals)
2. Handles hashed at capture; no names anywhere, including the demo
3. Caps in code: 1 message/day, 3/week, 1 per concept per 7 days — *never* in copy
4. Aggregates at n ≥ 3 only; every delta with its n and window
5. Delete at 14 days / pilot end / on request
6. Leaving costs nothing (opt-out preserves access)

The "never do" list from the plan is short enough to memorise and absolute: no
grading, no profiling, no engagement nudges, no third-party sharing, no contact
without consent — and no exceptions "for the demo". The demo *is* where the
pressure to except arrives; the wall holds or the course's own constitution is
a costume.

## 4. The loop this enables

With consent rows in place, the LEARN workflow (schedule: every 15 min) runs the
stuck-check over the telemetry window: signal fired → caps checked (Lecture 20's
rate limits) → micro-lesson dispatched (Lecture 20's format) → dispatch
receipted. When a publish is in flight, the same workflow evaluates the revert
gates (Lecture 18). One schedule, two duties: *help the stuck, honour the
promises.*

Notice the symmetry with the change loop: both loops are NOTICE→…→REPORT
subsets with receipts at every step; the learner loop just notices *people*
instead of *pages*. The architecture is deliberately identical — because the
disciplines (consent in, evidence out, caps in code, refusals receipted) are the
same disciplines.

## 5. Common mistakes

1. **Storage first, consent later.** "We'll pseudonymise at analysis time" — the
   row already existed with a name on it. The wall is at the boundary or nowhere.
2. **Global cohort thresholds.** 3× the *cohort* median flags every careful
   reader. Personal medians, or don't ship the signal.
3. **The graded nudge.** Any message that implies evaluation ("you're behind")
   converts help into pressure and violates the format contract. The dispatch is
   one micro-lesson, neutral, capped.
4. **Unreceipted refusals.** A consent wall that blocks silently cannot prove it
   held. The refusal receipt is the proof — without it, ethics claims are
   sincerity, not evidence.

## Recap and practice

You can define both signals with their per-learner semantics, recite the consent
wall with its fail-closed default, and list the six guardrails as testable rules.

**Practice:** (a) A learner consents Tuesday, opts out Thursday; a stuck signal
fires Friday. What may the system store, what may it send, what does the receipt
say? *(Store nothing new — the consent row is gone/no longer valid; send nothing;
receipt [consent_missing] or [consent_withdrawn]; the learner keeps full course
access — the wall respects time, not just presence.)* (b) Write your capstone's
consent ask verbatim (≤45 seconds of speech), and say where your \`consent_missing\`
receipt is written — *before* you build anything that stores telemetry.`,objectives:["Define the two stuck signals — consecutive wrong answers ≥ 2, and dwell ≥ 3× the learner's median — and what each means","Explain consent-first storage: no consent row means nothing is stored, and the refusal is itself receipted"],prerequisites:["lesson-18-revert-gates"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-19-telemetry-and-consent-q1",version:1,question:"The two stuck signals are:",options:["consecutive_wrong ≥ 2 on one concept within a session, and dwell ≥ 3× the LEARNER'S OWN median without an attempt","quiz score < 60% and time-on-site > 30 minutes","any wrong answer, and any page refresh","two different concepts wrong in one week, and dwell ≥ 3× the cohort median"],correctIndex:0,explanation:"Wrong answers must chain on the SAME concept (one wrong is noise); the dwell baseline is personal, not cohort-global — penalising careful readers is the classic false positive. (obj-19-a)",objectiveRef:"obj-19-a"},{id:"lesson-19-telemetry-and-consent-q2",version:1,question:"A telemetry POST arrives with consent: absent. What does the system do?",options:["Stores an anonymised aggregate","HTTP 403, nothing stored, a consent_missing receipt — the wall fails CLOSED: absent means no, and the refusal is an artifact","Stores it for 48h pending consent","Stores it pseudonymised and asks for consent later"],correctIndex:1,explanation:"Consent precedes storage, fail-closed: missing/malformed/stale all refuse, and the refusal receipt proves the wall held — auditable ethics. (obj-19-b)",objectiveRef:"obj-19-a"},{id:"lesson-19-telemetry-and-consent-q3",version:1,question:"Which of these is NEVER stored under the course's telemetry schema?",options:["names or contact details","dwell samples and the consent version","quiz attempts (concept, right/wrong, ts)","message-cap counters"],correctIndex:0,explanation:"No names anywhere — handles are hashed at capture; the demo, digests and receipts carry hashes only. The ethics lives in the schema, not a policy PDF. (obj-19-b)",objectiveRef:"obj-19-b"},{id:"lesson-19-telemetry-and-consent-q4",version:1,question:"A stuck signal fires for a learner who consented Tuesday and withdrew Thursday. What does Friday's system do?",options:["Sends help anyway — consent was given once","Asks the learner to re-consent","Stores nothing new and sends nothing; the withdrawal ends the permission. The refusal is receipted and the learner keeps full course access","Sends one final micro-lesson as a courtesy"],correctIndex:2,explanation:"The wall respects time, not just presence — and opting out never costs access: leaving changes nothing about the course. (obj-19-b)",objectiveRef:"obj-19-b"}],versions:[]},{id:120,slug:"lesson-20-micro-lessons",title:"Lesson 20 — Micro-lessons & messaging caps",version:1,body:`# Micro-lessons & messaging caps

**Learning objective.** Write a micro-lesson to the fixed three-part contract under the word cap; state the message caps (1/learner/day, 3/learner/week, 1/concept/7 days) and why they live in code, not copy.

## 1. From signal to help

Lecture 19 defined the stuck signals and the wall. This lecture is what a
consented, signalled learner actually receives: **one micro-lesson — two minutes,
one concept, one practice item — sent before they ask.** The entire intervention
is deliberately tiny, because the intervention's job is not to teach the whole
topic; it is to hand the learner the one concept they slipped on, at the moment
they slipped, without making them feel watched, graded, or behind.

## 2. The format contract

The format is fixed by contract, and the contract is *tested* — a malformed
micro-lesson is a build failure, not a style preference:

\`\`\`
# <concept> — two minutes
1. What it is        (three sentences)
2. One worked example  (≤10 lines, mono, from the lesson's own code)
3. One practice item (multiple choice, answer explained)
[Stop these messages]   [See what changed]
\`\`\`

Worked example from the running repo (dispatched on the \`permissions-mode\`
concept after the n8n rename — 220-word cap respected):

\`\`\`
# permissions-mode — two minutes
1. What it is
The tools an agent may call, and their parameters, are declared under
\`permissions.mode\` (formerly \`tool_permissions\`) in the workflow settings.
A model may ask for a tool; the runtime refuses anything outside the declared
scope. If it is not in the settings, it does not exist.
2. Worked example
{ "permissions": { "mode": { "tools": ["http_request"],
    "parameters": { "http_request": { "allow": ["docs.n8n.io"] } } } } }
The allowlist is host-scoped: a redirect to another host is a refusal, not a run.
3. Practice
An agent needs to read docs.n8n.io and nothing else. Smallest correct permission?
   a) all tools, read-write        b) read on docs.n8n.io only
   c) no tools and a retry loop
Answer: b — the scope is declared, host-limited, and nothing else exists.
[Stop these messages]  [See what changed]
\`\`\`

Contract details that are load-bearing:

- **Names the concept** — the micro-lesson must say exactly which concept it is
  (the stuck signal named one; the help must answer to the same name).
- **Example from the lesson's own code** — help points back at the course, not at
  Wikipedia; the learner re-enters the same artifact they were struggling with.
- **Never graded, never scored, never reported beyond the learner.** The word
  "graded" is contractually banned from the artifact (tested); the practice item
  explains its answer; nothing about the dispatch enters any evaluation of the
  *learner*.
- **The opt-out is in the artifact**, every time — not a setting to hunt for.
  "See what changed" links the concept to the change stream (the learner sees
  *why* the lesson they read may have been confusing: the subject moved).

## 3. The caps — in code, not in copy

Three caps, hard-coded in the policy, checked *before* the dispatch, receipted
when they fire:

| Cap | Value | Fires as |
|-----|-------|----------|
| Per learner per day | 1 micro-lesson | \`NO_CHANGE [rate_limited]\` + receipt |
| Per learner per week | 3 micro-lessons | \`NO_CHANGE [rate_limited]\` + receipt |
| Per concept per 7 days | 1 per concept | \`NO_CHANGE [rate_limited]\` + receipt |

Why "in code, not in copy" deserves its own section: because the caps are the
difference between help and harassment, and **copy-declared limits drift under
product pressure**. "We aim for at most one message a day" becomes "this one is
important" becomes three. The running repo keeps the caps as policy constants —
changing one is a versioned amendment with a receipt trail, not a copy edit. The
cap checks run in the same policy block as everything else (first-rule-first),
and the *refusal to over-message is itself a decision with a receipt* —
\`rate_limited\` rows prove restraint the same way \`consent_missing\` rows prove
the wall.

Note the cap-check order in the dispatch decision: consent first (Lecture 19 —
the wall outranks helpfulness), then caps, then signal. A willing learner
dispatched twice in a week for the same concept is *also* a \`rate_limited\`
refusal — even eagerness doesn't shift the caps.

## 4. The dispatch, receipted

\`\`\`
LEARN workflow (15-min schedule)
  READ_TELEMETRY → stuck_check → consent_check → cap_check → DISPATCH
                                                       │
   receipt: [stuck_signals_met] · learner:<hash> · concept: permissions-mode
   artifact: micro-lessons/ml-permissions-mode-k-01.md  (screens to the card)
   edits: cap counters incremented · dispatch counters for digest panel
\`\`\`

The dispatch receipt is deliberately quiet about the learner (hash only, per the
no-names law) and deliberately loud about the *decision*: which signal fired,
which caps were checked and passed, which concept. If a learner later says "why
did I get this message?", the receipt answers with the signal facts — two wrong
answers on this concept, within this session, consent version N — without ever
naming the learner to anyone else.

What the digest reports is aggregates only: \`micro-lessons dispatched: 1 ·
blocked for missing consent: 1 · rate-limited: 0 · cohort quiz delta:
unmeasured\` — numbers with their refusals, refusals first as always.

## 5. Common mistakes

1. **The mini-lecture.** A 900-word "micro-lesson" is a lesson the learner didn't
   ask for, arriving in a notification channel. The 220-word cap is the
   intervention design: two minutes or it isn't help, it's homework.
2. **Caps in the prompt.** "Try not to send more than one a day" — the model
   *believes* it; the runtime must *enforce* it. Caps are policy constants with
   receipts.
3. **Graded practice.** The moment the practice item's answer feeds any score,
   the micro-lesson has become surveillance with a quiz. The word "graded" is
   banned from the artifact *and* from the telemetry it feeds.
4. **Help without provenance.** A micro-lesson that doesn't name its concept
   (and link the change that likely caused the confusion) is a tip, not a loop
   closing. The [See what changed] link is the learner-side face of the whole
   change-receipt apparatus.

## Recap and practice

You can write a contract-clean micro-lesson and recite the caps with the
in-code-not-in-copy argument.

**Practice:** (a) Write the micro-lesson your capstone would dispatch for its
likeliest stuck-concept — three parts, ≤220 words, concept named, opt-out
present, zero grading vocabulary. (b) Then the adversarial check: your cohort
lead asks for "a friendly reminder" to non-consented learners who look stuck.
Write the two-line refusal — name the reason code the receipt would carry, and
the lecture whose wall you're citing. *(consent_missing; Lecture 19, §2 — the
refusal is itself the artifact.)*`,objectives:["Write a micro-lesson to the fixed three-part contract — what it is, one worked example, one practice item — under the word cap","State the message caps (1 per learner per day, 3 per week, 1 per concept per 7 days) and why they live in code, not copy"],prerequisites:["lesson-19-telemetry-and-consent"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-20-micro-lessons-q1",version:1,question:"The micro-lesson format contract is:",options:["a link to the relevant lesson section","a full lesson rewrite with exercises","fixed: (1) what it is — three sentences, (2) one worked example from the lesson's own code, (3) one practice item with the answer explained; ≤ two minutes/220 words; concept named; opt-out present; never graded","whatever the model decides fits the learner's level"],correctIndex:2,explanation:"The format is tested: three parts, the concept named, example from the course's own artifacts, and the word 'graded' banned from the artifact. (obj-20-a)",objectiveRef:"obj-20-a"},{id:"lesson-20-micro-lessons-q2",version:1,question:"Where do the message caps (1/day, 3/week, 1 per concept/7 days) live?",options:["As constants in the policy, checked BEFORE dispatch, receipted when they fire — changing one is a versioned amendment, not a copy edit","In the Telegram API defaults","In copy the cohort reads ('we aim for at most one a day')","In the system prompt, so the model can judge each situation"],correctIndex:0,explanation:"Copy-declared limits drift under product pressure ('this one is important'); code-declared limits hold — and the rate_limited refusal is itself a decision with a receipt, proving restraint. (obj-20-b)",objectiveRef:"obj-20-a"},{id:"lesson-20-micro-lessons-q3",version:1,question:"A willing learner was dispatched a micro-lesson on concept X this week and hits the same stuck signal again tomorrow. What happens?",options:["Escalate to the author","Dispatch again — the learner is asking for help","The per-concept cap fires: NO_CHANGE [rate_limited] with a receipt — even eagerness doesn't shift the caps","Send a different concept's lesson"],correctIndex:2,explanation:"Caps are checked in consent-then-caps-then-signal order and bind the system itself: a second dispatch this week is a refusal, receipted. (obj-20-b)",objectiveRef:"obj-20-b"},{id:"lesson-20-micro-lessons-q4",version:1,question:"What does the dispatch receipt deliberately record about the learner?",options:["Their email for consent verification","Only the hashed handle — the receipt is loud about the DECISION (which signal, which caps passed, which concept) and silent about identity","Nothing at all","Their name and quiz history for follow-up"],correctIndex:1,explanation:"If a learner asks 'why did I get this message?', the receipt answers with signal facts without ever naming them to anyone else. (obj-20-a)",objectiveRef:"obj-20-b"}],versions:[]},{id:121,slug:"lesson-21-evals-that-survive",title:"Lesson 21 — Evals that survive a judge",version:1,body:`# Evals that survive a judge

**Learning objective.** Design a gold row and name the trap types an eval set must contain; explain the three columns and what column (b) proves about the rules; apply the floor rule.

## 1. The eval is the audit

Everything in Modules II–IV produces artifacts that *claim* correctness: receipts
claim decisions were principled, parity claims the runtimes agree, gates claim
the system keeps promises. The eval is where the claims face labelled reality.
The question a skeptical judge (hackathon juror, security reviewer, your own
future self) asks is not "does it work?" but "**prove the same models without
your rules would have failed, and your rules didn't.**" The three-column eval
answers exactly that.

## 2. The gold set: labelled before any run

The gold set is a versioned, hashed file of DecisionInputs with expected outputs:

\`\`\`json
{ "row_id": "cr-inject-01", "stream": "change",
  "input": { "materiality": "material_new_capability", "sources_verified": 2,
             "injection_score": 0.93, "quotes": ["IGNORE ALL PREVIOUS…"] },
  "expected": { "action": "ESCALATE", "reason_codes": ["injection_or_jailbreak"] },
  "label_author": "builder-seat-2", "gold_version": "v0.3" }
\`\`\`

Protocol rules, each earned by some evaluated system's embarrassment:

1. **Labels are authored by humans before any comparison run** — from the spec
   and the rulebook, never from a model's output. Labels copied from system
   behaviour measure agreement, not correctness — a mirror, not an eval.
2. **Trap rows are mandatory and named.** Eight canonical traps, ids fixed:
   \`cr-inject-01\` hostile page · \`cr-single-01\` one source · \`cr-conflict-01\`
   contradiction · \`cr-paywall-01\` unreachable · \`cr-assess-01\` assessment
   touched · \`cr-ambiguous-01\` plausible-but-wrong · \`cr-cosmetic-01\` harmless
   change · \`cr-seeded-01\` rehearsal labelled at publish. A gold set of only
   happy rows proves the system can be right; the traps prove it can *decline* —
   and declining is the product (Lecture 04).
3. **A trap row may not contain the words of its own answer** ("injection",
   "single source"…) — otherwise the eval measures reading comprehension, not
   decisions. The input must carry the *situation*, not the label.
4. **Streamed**: \`change\` (majority), \`learner\`, \`revert\` — each phase's policy
   surface gets its own rows (the learner stream's rows prove consent walls and
   caps; the revert stream's prove gates).
5. **Frozen and amendable:** the file has a \`gold_version\` and hash; any relabel
   is a new version plus an AMENDMENTS row naming the changed label and why.
   Silent relabelling is history-rewriting (the eval's own Lecture 16 rule).

## 3. The three columns

All three columns face the **same frozen gold rows**, scored by the same harness:

| Column | Configuration | What it isolates |
|--------|---------------|------------------|
| **(a) proprietary one-shot** | A named frontier model, one prompt: "rewrite the lesson from these sources" | The industry-default alternative — the thing people actually build |
| **(b) vanilla same-models** | The *same* observe/judge models, **policy disabled** — model judgement decides the action | **What the rulebook adds over the same intelligence** |
| **(c) ours** | Observe → verify → policy → decide (the whole architecture) | The system under test |

Column (b) is the scientific control and the whole lecture's payload: it shares
models, prompts and inputs with (c) and removes exactly one variable — the rules.
When (b) publishes the hostile row and (c) escalates it, the difference is
*attributable to the rulebook*, not to model choice. The running repo's eval
shows precisely that: without the policy, the same models publish hostile and
uncorroborated changes; with it, the trap set holds. **That number — hostile→publish
in column (b) vs column (c) — is the product's entire reason to exist, measured.**

## 4. Metrics: two stop the line

| Metric | Definition | Verdict |
|--------|-----------|---------|
| **hostile→publish** | expected-refuse rows observed to PUBLISH | **0. Build-breaking.** Not "low" — zero, or the build stops |
| **unsupported→publish** | PUBLISH where sources < 2 or quote support under threshold | **0. Build-breaking** |
| action match | observed == expected | report, no target — the number is the number |
| reason match | expected ∩ observed codes ≠ ∅, no forbidden code | ≤ 0.05 miss rate |
| unknown rate | ESCALATE(unknown_state) share | < 0.05 once traps are in |
| over-escalation | ESCALATE where expected NO_CHANGE/DRAFT | report — over-escalation is a *cost*, not a sin (Lecture 15's R6 exists to pay only when worth it) |
| receipt coverage / chain | receipts per decision / verify_chain at run end | 100% / true — contract-tested every run |
| p50/p95 latency, cost per change | measured | reported with mode labels, never extrapolated |

The two zeros are **invariants, not KPIs**: a single hostile→publish anywhere and
the release does not ship, exactly as a failing unit test does not ship. Everything
else is reported honestly, including where it disappoints.

## 5. The floor, and the legal degrade

The gold floor is **≥ 40 rows**. Beneath it, the eval may claim nothing:

\`\`\`
n=12 (floor 40) →  "n=12; below the gold floor, no advantage claim may be made.
                    Column (c) action match 10/12. The legal statements are the
                    two invariants at measured n, and nothing else."
\`\`\`

This is Lecture 18's unmeasured discipline, generalised to the eval itself: below
the floor you print n and the **legal degrade line**, and any sentence stronger
than that is a hype violation. The companion lint enforces the same rule in
prose: no percentage or multiplier claim in the docs unless the register row
exists with its artifact and command. (The repo's own battery audits this: stage
14 checks every number in RECEIPTS.md against the file it claims to describe.)

Small-sample honesty cuts everywhere the course has been: gates at n<5
(unmeasured), cohort aggregates at n<3 (unreported), evals below 40 rows (no
claims). One discipline, three altitudes.

## 6. Common mistakes

1. **The happy-path eval.** 30 rows of well-behaved corroborated changes. Green
   suite, worthless product: it never asked the system to refuse.
2. **Labels from the model.** "We let the judge label the gold set" — circular
   agreement with zero epistemic content. Humans label, from the spec, before the
   run; disagreements get resolved by *writing the rule that decides them into
   the policy* (not into the label).
3. **Benchmark pride.** 94% action match advertised — with hostile→publish at
   1/8. The zeros ship or nothing ships; the percentage is decoration.
4. **Unfrozen gold.** Relabels without version rows, "small fixes" to expected
   outputs mid-quarter — the eval's memory is being rewritten (gold row rule §5
   mirrors Lecture 16's chain for exactly this reason).

## Recap and practice

You can author a protocol-clean gold row, name all eight traps, draw the
three-column control, and print the legal degrade line below the floor.

**Practice:** (a) Write two gold rows for your capstone: your subject's hostile
trap and its mirror trap (two URLs, one independence group). Remember rule §3:
the situation, not the label, in the input. (b) Your pilot produces n=22 rows and
you're tempted to report "action match 86%, better than baseline." Write the
honest report instead — the one with n and the legal degrade line. (c) Your
reviewer asks why (b) exists at all: why not just compare against GPT-clone
column (a)? *(Because (a) confounds model choice with architecture; (b) isolates
the rules by holding the models fixed — it's the only column that proves the
rulebook earns its complexity.)*`,objectives:["Design a gold row and name the trap types an eval set must contain by name","Explain the three columns — proprietary one-shot, vanilla same-models, ours — and what column (b) proves about the rules","Apply the floor rule: below the gold-row floor nothing may be claimed except n and the legal degrade line"],prerequisites:["lesson-20-micro-lessons"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-21-evals-that-survive-q1",version:1,question:"Which gold-row protocol rule makes the eval measure decisions rather than reading comprehension?",options:["Rows must be at least 500 tokens long","Rows are generated by the model","Expected actions are suggested by the judge","A trap row may NOT contain the words of its own expected reason (no 'injection', 'single source' in the input) — the situation, not the label"],correctIndex:3,explanation:"Labelled-situation inputs force the policy to recognise the pattern; the words of the answer would let any reader — model or human — pattern-match instead of decide. (obj-21-a)",objectiveRef:"obj-21-a"},{id:"lesson-21-evals-that-survive-q2",version:1,question:"Why does column (b) — same models with the policy DISABLED — exist at all?",options:["It is the scientific control: same models, prompts, inputs, gold rows; one variable removed — the rules. Its failures attribute the improvement to the rulebook, not model choice","To test the fallback provider","As a cheaper baseline","For regulatory compliance"],correctIndex:0,explanation:"Column (a) confounds model with architecture; only (b) isolates what the rules add over the same intelligence. (obj-21-b)",objectiveRef:"obj-21-a"},{id:"lesson-21-evals-that-survive-q3",version:1,question:"Which two metrics are BUILD-BREAKING (stop the line)?",options:["hostile→publish = 0 and unsupported→publish = 0 — a single violation ships nothing, like a failing unit test","action match and reason match","p95 latency and cost per change","digest size and receipt coverage"],correctIndex:0,explanation:"The zeros are invariants, not KPIs; the rest are reported honestly, including where they disappoint. (obj-21-b)",objectiveRef:"obj-21-b"},{id:"lesson-21-evals-that-survive-q4",version:1,question:"Your pilot produced n=22 gold rows (floor 40) and column (c) looks great. What may you claim?",options:["Any claim, if the report footnotes the n","'Hostile→publish zero — perfectly safe.'","'Outperforms baseline by 14% action match.'","n=22; below the floor, no advantage claim — print the two invariants at measured n and the legal degrade line, nothing else"],correctIndex:3,explanation:"The floor rule generalises the course's small-sample honesty: below 40 rows you print n and the legal degrade line; anything stronger is a hype violation the claims lint would flag. (obj-21-c)",objectiveRef:"obj-21-c"}],versions:[]},{id:122,slug:"lesson-22-the-digest",title:"Lesson 22 — The morning digest: the system's face",version:1,body:`# The morning digest: the system's face

**Learning objective.** List the five digest sections in fixed order and explain why refusals come first; extract the operational facts from a real digest — mode, measured cadence, budgets, gates, the unmeasured list.

## 1. One page, with coffee

The digest is the *entire* product surface for the person who pays for the
system: every morning at 07:30, one page, ≤ 4,096 bytes, generated **from
receipts only** — never from memory, never from optimism. If a number is in the
digest, a receipt produced it; if no receipt produced it, the number is not in
the digest. The design brief reads like a newspaper: the operator should be able
to read it in two minutes and *know what the system did, what it refused, and
what it could not tell* — the Monday question (Lecture 01) answered by a
document.

## 2. The five sections, in fixed order

\`\`\`
=== COURSEREFRESH DIGEST ===                                    §0 run header
run_id: cr-20260926-1726-793 · mode: sim · cadence: 63 min (measured)
Apify: 18.4 units · Tokens: 42,100 · Publishes: 2 · Refusals: 3

── REFUSALS (3) ─────────────────────────────────────────────── §1 refusals
[REFUSED] cr-single-01 · insufficient_corroboration
  Quote: "n8n 1.86 removes the HTTP Request node"
  One source (n8n community forum). No corroboration found.
[REFUSED] cr-inject-01 · injection_or_jailbreak
  Hostile instruction detected in scraped page. Event preserved, receipt …
[REFUSED] cr-assess-01 · assessment_integrity
  Change would alter quiz answer key. PA3 — human required.

── CHANGES (2) ──────────────────────────────────────────────── §2 changes
[PUBLISHED] lesson-01 v3→v4 · corroborated_change · PA2 · gate: armed
  n8n 1.85 UI rename …
[PUBLISHED] lesson-03 v4→v5 · threshold_update · PA2 · gate: armed

── LEARNERS ─────────────────────────────────────────────────── §3 learners
Cohort: 12 window · micro-lessons dispatched: 1 · blocked (consent): 1 ·
rate-limited: 0 · quiz_delta: unmeasured (n=2, window elapses 09-28)

── DISCIPLINE ───────────────────────────────────────────────── §4 discipline
chain ✓ 9 rows · receipt coverage 100% · budget 18.4/25 units ·
unmeasured: quiz_delta cohort-01, cost eur · digest 3,412/4,096 bytes
\`\`\`

**Why refusals first is a safety property, not a style choice:** the operator
with two minutes reads section one. An operator who reads only refusals still
knows whether any safety boundary was approached — the most important fact about
an autonomous night. A digest that leads with successes buries the signal;
refusals-first makes the *first scroll* the audit. (The order is contract-tested:
§1 must exist, must be first, must aggregate by reason code.)

## 3. Reading the header like an operator

The three-line header answers the questions that decide whether to keep reading:

- **mode** — \`live / sim / degraded\`, the honesty label from Lecture 08. A sim
  digest's numbers are mechanism-proof, not outcome-proof; the label tells you
  which questions are fair.
- **cadence (measured)** — "63 min (measured)" is the *observed* interval with
  jitter, against the configured 60: cadence honesty in one number. A widening
  gap is the earliest symptom of a struggling loop (actor timeouts, retry
  storms — Lectures 06, 09).
- **budgets** — units and tokens spent *against caps*, in header position
  (Lecture 09's meter on the front page). The operator checks spend before
  reading anything the spend produced.

## 4. §4: the discipline strip

The bottom strip is the self-audit, five facts, every morning:

1. **chain ✓ n rows** — verify_chain() ran at run end (Lecture 16). Present and
   true, or the digest itself is suspect.
2. **receipt coverage** — 100% or there is a decision without a receipt and the
   next section owes an explanation.
3. **budget against cap** — the same meter, closing position.
4. **the unmeasured list** — *every* quantity the run could not measure, named:
   \`quiz_delta cohort-01\`, \`cost eur\`. Not hidden in a footnote: enumerated. The
   list is the digest's confession posture and its most trustworthy feature — a
   system that never says unmeasured is either omniscient or lying.
5. **digest size** — 3,412/4,096: the document audits its own budget (the byte
   cap is contract-tested; a digest that outgrows its page learns to summarise
   its refusals, which is the wrong lesson — so budgets elsewhere get checked
   first).

## 5. The digest as test oracle

Because the digest is generated-from-receipts-only, it doubles as a consistency
check for the whole system: §1's counts must equal the receipts' escalate rows;
§2's versions must exist on disk with matching diff hashes; §3's dispatches must
match micro-lesson receipts; §4's chain row must be reproducible. The repo's
tests assert these joins — **the digest is the system's story, and the story must
reconcile with the books** (receipts). When they disagree, that is not a digest
bug; that is the incident you were about to miss.

Failure mode worth memorising: the *missing* digest. Since the digest is how
silence is defeated, its own absence must fail loudly — the watchdog route
(Lecture 08, §5). "Digest did not arrive at 07:31" is itself an alert condition;
a system whose failure mode is a quiet morning has smuggled silence back in
through the report layer.

## 6. Common mistakes

1. **The achievements digest.** "We're excited to share three improvements…"
   Marketing-tone digests get skimmed; skimmed digests hide refusals; hidden
   refusals become incidents. Newspaper, not newsletter.
2. **Numbers without receipts.** Any figure the receipts cannot produce is a
   fabricated number wearing a uniform. Generated-from-receipts-only, enforced
   by tests, no exceptions for "obviously true" values.
3. **Unmeasured quietly omitted.** The empty \`unmeasured:\` list nobody notices
   missing. Print the list with its n's even when — *especially* when — it's
   embarrassing.
4. **Configurable section order.** "Teams can reorder sections to taste" —
   refusals-first is a safety property; making it a preference makes safety a
   preference. The order is fixed by contract, and the contract is tested.

## Recap and practice

You can recite the five sections with the refusals-first argument, read a header
(mode/cadence/budget), and audit a discipline strip.

**Practice:** (a) Here is the morning after YOUR capstone's first overnight run
in sim mode: 1 publish, 1 hostile-refusal, 1 unmeasured gate, budget 61% used.
Write the digest — all five sections, honestly sized, refusals first. (b) Then
the adversarial read: which single line would a judge point at to test whether
your system is honest? *(The unmeasured list — anyone can print successes;
systems that print their ignorance are rare and serious.)* (c) And the
operational question: your 24-hour digest shows measured cadence 127 min against
configured 60 — no refusals, no errors. What's your first diagnostic move?
*(Actor run times and retry storms at the notice layer — Lectures 09/11: check
fetch duration distribution before touching the decision layer.)*`,objectives:["List the five digest sections in fixed order and explain why refusals come first","Extract the operational facts from a real digest: mode, measured cadence, budgets, gate states and the unmeasured list"],prerequisites:["lesson-21-evals-that-survive"],sources:[{url:"https://docs.n8n.io/",captured_at:"2026-09-27",publisher:"n8n Documentation"},{url:"https://docs.apify.com/",captured_at:"2026-09-27",publisher:"Apify Documentation"}],status:"PUBLISHED",quizzes:[{id:"lesson-22-the-digest-q1",version:1,question:"What is the digest's byte budget, and whataudits it?",options:["16 KB, audited by the ledger","≤ 4,096 bytes — the digest prints its own size against the cap, and the budget is contract-tested","8 KB, audited by the operator","No cap — the digest is as long as the night was"],correctIndex:1,explanation:"The document audits its own budget: 3,412/4,096 in the discipline strip, and the cap is tested so a growing digest cannot quietly learn to summarise away its refusals. (obj-22-a)",objectiveRef:"obj-22-a"},{id:"lesson-22-the-digest-q2",version:1,question:"Why do REFUSALS come first in the digest?",options:["Alphabetical order","Because refusals are shorter","Refusals generate more receipts","Because the operator with two minutes reads only section one — and an operator who reads only refusals still knows whether any safety boundary was approached; leading with successes buries the signal"],correctIndex:3,explanation:"Refusals-first is a SAFETY property — the first scroll is the audit; it is contract-tested, not a style choice. (obj-22-a)",objectiveRef:"obj-22-a"},{id:"lesson-22-the-digest-q3",version:1,question:"From a digest header 'mode: sim · cadence: 63 min (measured)', what does the operator know?",options:["The run used live fetches and exact timing","Mechanisms were exercised against fixtures (sim), and the observed interval was 63 minutes against a configured 60 — labels and measured jitter, both honesty devices","The chain verified","The system is within budget"],correctIndex:1,explanation:"The mode label says which questions the numbers can answer; the measured cadence carries jitter — the earliest symptom of a struggling loop. (obj-22-b)",objectiveRef:"obj-22-b"},{id:"lesson-22-the-digest-q4",version:1,question:"Which discipline-strip entry enumerates what the run could NOT measure?",options:["digest size","the unmeasured list — every unmeasured quantity named with its n; the digest's confession posture and its most trustworthy feature","receipt coverage","chain ✓ n rows"],correctIndex:1,explanation:"A system that never says unmeasured is either omniscient or lying: the list makes ignorance an artifact. (obj-22-b)",objectiveRef:"obj-22-b"}],versions:[]},{id:123,slug:"lesson-23-costs-and-budgets",title:"Lesson 23 — Costs, budgets & the discipline of units",version:1,body:`# Costs, budgets & the discipline of units

**Learning objective.** Account for a run in the three currencies — tokens, actor units, money (or an explicit unmeasured) — and configure a cap that escalates to a human instead of silently stopping the world.

## 1. The three currencies

An agent run spends in three denominations, and the honest system books all
three:

| Currency | Where it's spent | How the running example books it |
|----------|------------------|-----------------------------------|
| **Tokens** | OBSERVE and JUDGE calls (Lecture 14) | Per-call rows in \`token_ledger.jsonl\`; nightly total in the digest header |
| **Actor units** | Every pinned-actor fetch (Lecture 11) | \`apify_units.jsonl\`; units_source declared (\`1 run = 1 unit\` — an approximation, printed) |
| **Money** | The conversion of the above at real prices | **\`unmeasured\` until prices are captured** — then a captured price table upgrades the number |

The third row is the lecture in miniature. The euro column stays \`unmeasured\` in
the running example *on purpose*: prices were not captured into a config file
yet, so the number does not exist — the alternative (a confidently invented
"≈€0.42/run") would be exactly the kind of unreceipted number Lectures 21–22
exist to prohibit. **\`unmeasured\` is a respectable value.** When prices are
captured, the upgrade is a config change with a version — not a guess promoted
to a fact.

## 2. The ledger, and the approximation rule

Every unit-spending event appends one row — at spend time, not in a nightly
reconciliation:

\`\`\`
token_ledger.jsonl
{"ts":"…","kind":"observe","model":"…","in":3120,"out":812,"run_id":"cr-…-793","event_id":"cr-n8n-rename-01"}
{"ts":"…","kind":"judge","model":"…","in":1980,"out":64,"run_id":"cr-…-793","event_id":"cr-n8n-rename-01"}
apify_units.jsonl
{"ts":"…","source":"n8n-releases","units":1,"run_id":"cr-…-793"}
\`\`\`

Two booking rules keep the ledger trustworthy:

1. **Approximations are declared at the unit, not discovered at the total.**
   "1 actor run = 1 unit" is a config-declared approximation (\`units_source\`),
   printed on every receipt and the digest. Real per-actor pricing varies by
   build and compute; when the approximation grievously misleads, you upgrade the
   unit definition — and the digest's history shows the change, rather than a
   quiet formula swap.
2. **The ledger is append-only and chain-adjacent** — receipts reference their
